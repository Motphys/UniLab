name: CI Full

# Full CI: runs all evidence, benchmark, and acceptance shards excluded from
# the standard ci.yml PR gate.  Trigger this manually or let it run on the
# weekly schedule before merging high-risk PRs.
#
# Shards covered here (do not overlap with ci.yml standard shards):
#   c — tests/acceptance          (phase evidence, marked slow)
#   e — tests/benchmark            (local_evidence gates, benchmark profiling)
#   g — issue705 final gate script
#   h — issue705 audit + drake smoke scripts
#
# The union of ci.yml shards and ci-full.yml shards covers every test file;
# audit_ci_test_shards.py validates this property.

on:
  workflow_dispatch:
  schedule:
    # Weekly on Monday 02:17 UTC to spread load away from the :00 mark
    - cron: "17 2 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  # Re-run static checks so full CI is a self-contained pass/fail signal.
  ruff-lint:
    timeout-minutes: 5
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
      - name: Install dependencies(only dev group)
        run: uv sync --only-group dev
      - name: Check
        run: uv run --no-sync ruff check --output-format=github .

  ruff-format:
    timeout-minutes: 5
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
      - name: Install dependencies(only dev group)
        run: uv sync --only-group dev
      - name: Check
        run: uv run --no-sync ruff format --check .

  benchmark-smoke:
    timeout-minutes: 8
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-client0
      - name: Install dependencies
        run: |
          uv sync --extra mujoco --extra motrix \
            --no-install-package torch \
            --no-install-package nvidia-cublas-cu12 \
            --no-install-package nvidia-cuda-cupti-cu12 \
            --no-install-package nvidia-cuda-nvrtc-cu12 \
            --no-install-package nvidia-cuda-runtime-cu12 \
            --no-install-package nvidia-cudnn-cu12 \
            --no-install-package nvidia-cufft-cu12 \
            --no-install-package nvidia-cufile-cu12 \
            --no-install-package nvidia-curand-cu12 \
            --no-install-package nvidia-cusolver-cu12 \
            --no-install-package nvidia-cusparse-cu12 \
            --no-install-package nvidia-cusparselt-cu12 \
            --no-install-package nvidia-nccl-cu12 \
            --no-install-package nvidia-nvjitlink-cu12 \
            --no-install-package nvidia-nvtx-cu12 \
            --no-install-package triton
          uv pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Benchmark entrypoint smoke test
        run: uv run --no-sync python benchmark/smoke_test.py

  test-shard:
    name: test shard (${{ matrix.shard }})
    # Generous per-shard timeout: evidence and benchmark tests can run longer
    # than the ubuntu-slim 15-min hard limit that caused silent cancellations.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: c
            paths: tests/acceptance
          - shard: e
            paths: tests/benchmark
          - shard: g
            paths: tests/scripts/test_issue705_final_gate.py
          - shard: h
            paths: >-
              tests/scripts/test_drake_training_smoke.py
              tests/scripts/test_issue705_claim_gap_audit.py
              tests/scripts/test_issue705_dr_inventory.py
              tests/scripts/test_issue705_g1_baseline.py
              tests/scripts/test_issue705_legacy_retirement_audit.py
              tests/scripts/test_issue705_phase_acceptance.py
              tests/scripts/test_issue705_support_audit.py
              tests/scripts/test_issue705_task_rollout_audit.py
              tests/scripts/test_issue705_thresholds.py
              tests/scripts/test_issue705_workflow_audit.py
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-client0
      - name: Install dependencies
        run: |
          uv sync --extra mujoco --extra motrix \
            --no-install-package torch \
            --no-install-package nvidia-cublas-cu12 \
            --no-install-package nvidia-cuda-cupti-cu12 \
            --no-install-package nvidia-cuda-nvrtc-cu12 \
            --no-install-package nvidia-cuda-runtime-cu12 \
            --no-install-package nvidia-cudnn-cu12 \
            --no-install-package nvidia-cufft-cu12 \
            --no-install-package nvidia-cufile-cu12 \
            --no-install-package nvidia-curand-cu12 \
            --no-install-package nvidia-cusolver-cu12 \
            --no-install-package nvidia-cusparse-cu12 \
            --no-install-package nvidia-cusparselt-cu12 \
            --no-install-package nvidia-nccl-cu12 \
            --no-install-package nvidia-nvjitlink-cu12 \
            --no-install-package nvidia-nvtx-cu12 \
            --no-install-package triton
          uv pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test with coverage
        env:
          COVERAGE_FILE: coverage.${{ matrix.shard }}
        run: >-
          uv run --no-sync pytest ${{ matrix.paths }}
          -m "not local_evidence"
          -x
          --cov=src/unilab --cov-report= --cov-fail-under=0
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-full-${{ matrix.shard }}
          path: coverage.${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 3

  test-full:
    name: test-full (ubuntu-slim)
    if: always()
    needs: [benchmark-smoke, test-shard]
    runs-on: ubuntu-slim
    steps:
      - name: Require smoke and all full test shards
        env:
          BENCHMARK_SMOKE_RESULT: ${{ needs.benchmark-smoke.result }}
          TEST_SHARD_RESULT: ${{ needs.test-shard.result }}
        run: |
          test "$BENCHMARK_SMOKE_RESULT" = success
          test "$TEST_SHARD_RESULT" = success
