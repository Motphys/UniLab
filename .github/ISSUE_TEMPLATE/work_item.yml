name: Work Item
description: Track a feature, benchmark, infra task, simulation task, or docs task.
title: "Work: "
labels:
  - enhancement
body:
  - type: dropdown
    id: scope_level
    attributes:
      label: Scope level
      description: Choose roadmap for an integrated outcome delivered through multiple child PRs; choose implementation for one cohesive review unit.
      options:
        - implementation
        - roadmap
        - research
    validations:
      required: true

  - type: dropdown
    id: work_type
    attributes:
      label: Work type
      options:
        - feature
        - benchmark
        - infra
        - sim
        - test
        - docs
        - toreal
        - research
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - G1
        - Go2
        - dexterous-hand
        - WBT
        - motrix
        - mujoco
        - benchmark
        - CI/tooling
        - docs
        - other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap or opportunity does this work address?
    validations:
      required: true

  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: What cohesive, reviewable output is expected? Include the code, config, tests, and docs needed to make that result complete.
      placeholder: |
        Examples:
        - merged code
        - W&B benchmark run
        - ONNX export validated on target toolchain
        - demo video
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and delivery boundaries
      description: Describe the work kept together for this outcome and the independently valuable work tracked elsewhere.
      placeholder: |
        In this work item:
        - ...

        Related follow-up or separate outcomes:
        - ...
    validations:
      required: true

  - type: textarea
    id: roadmap
    attributes:
      label: Roadmap relationship and target branch
      description: For a roadmap, record its declared base branch, child issues, and planned dev/issue-<number>-<slug> integration branch. For a child issue, link the parent roadmap and use its integration branch as the PR base.

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: List the acceptance criteria.
      placeholder: |
        - make test-all passes on the final local head
        - current-head remote CI passes when the PR base is main
        - benchmark attached
        - docs updated
    validations:
      required: true

  - type: textarea
    id: dependency
    attributes:
      label: Dependencies and blockers
      description: Link blocking issues or external dependencies if known.

  - type: input
    id: owner
    attributes:
      label: Proposed owner
      description: GitHub handle or team member name if handle mapping is not yet confirmed.

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: How will this work be verified?
