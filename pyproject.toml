[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Robot meshes/textures are hosted on Hugging Face (unilabsim/unilab-robots)
# and downloaded into these paths on first use; keep them out of the
# wheel/sdist even when they exist in the source tree. XML and small metadata
# stay packaged. Directories must stay in sync with ROBOT_ASSET_SPECS in
# src/unilab/assets/hub.py.
source-exclude = [
    "/src/unilab/assets/robots/a2/assets",
    "/src/unilab/assets/robots/allegro_hand/assets",
    "/src/unilab/assets/robots/g1/assets",
    "/src/unilab/assets/robots/g1/textures",
    "/src/unilab/assets/robots/go2/assets",
    "/src/unilab/assets/robots/go2_arm/assets",
    "/src/unilab/assets/robots/microduck/assets",
    "/src/unilab/assets/robots/sharpa_wave/meshes",
    "/src/unilab/assets/robots/t800/assets",
    "/src/unilab/assets/robots/t800/textures",
    "/src/unilab/assets/robots/x2/meshes",
]

[project]
name = "unilab"
version = "0.1.0"
description = "Universal Lab for Robot Learning"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UniLab Authors" }]
keywords = ["robot-learning", "reinforcement-learning", "mujoco", "simulation"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy",
    # Physics implementations are provided by the independently released
    # unisim-core package from the production PyPI index.
    "unisim-core>=0.1.14",
    "numba>=0.67",
    "prettytable>=3.10",
    "torch==2.9.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torch==2.8.0 ; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "gymnasium",
    "imageio",
    "etils",
    "hydra-core>=1.3",
    "tensordict",
    "rsl-rl-lib>=5.0.0",
    "packaging",
    "mediapy",
    # >=2.21 drops the pkg_resources import removed in setuptools>=82,
    # which otherwise breaks `uv run tensorboard` at startup.
    "tensorboard>=2.21.0",
    # Unpinned: quadrants (genesis-world 1.3.3 pin) requires setuptools>=77,
    # and nothing in this repo imports setuptools/pkg_resources at runtime.
    "setuptools",
    "rich",
    "tqdm",
    "typing-extensions",
    "lark>=1.3.1",
    "wandb",
    "onnxruntime<1.20 ; python_version < '3.11'",
    "onnxruntime>=1.20 ; python_version >= '3.11'",
    "huggingface_hub>=0.25",
    "ninja ; sys_platform == 'linux'",
    "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
train = "unilab.cli:train_main"
eval = "unilab.cli:eval_main"
demo = "unilab.cli:demo_main"
unilab-complete = "unilab.cli_completion:main"
unilab-viz-nan = "unilab.utils.nan_viz:main"
unilab-export-scene = "unisim.backend.mujoco.export_scene:main"
unilab-render-teaser = "unilab.visualization.teaser:main"
unilab-pull-assets = "unilab.assets.pull:main"

[project.optional-dependencies]
drake = [
    # Python runtime for the Drake batch adapter. Drake C++ remains an external
    # toolchain and the native extension must be built against the local
    # DRAKE_HOME after this extra is synced.
    "drake-uni==0.1.0",
    # Drake playback always uses MuJoCo's native renderer (MuJoCo is never
    # stepped). Keep the renderer available from the single Drake install
    # path; the MuJoCo physics extension remains in the separate mujoco extra.
    "mujoco>=3.5",
]
mujoco = [
    # Bound stays loose; the committed uv.lock pins the default solver version
    # (uv prefer-locked semantics). The tested window is >=3.5,<3.11 — switch
    # within it via `make mujoco MJ=<version>`.
    "mujoco>=3.5",
    "mujoco-uni-runtime==0.4.0",
    # pybind11/wheel are build requirements of mujoco-uni-runtime, which is
    # compiled in this environment (see no-build-isolation-package below).
    "pybind11>=2.12",
    "wheel",
]
mjwarp = [
    # Keep the Warp backend on the same MuJoCo minor line as the host backend.
    # ``mujoco-warp`` imports as ``mujoco_warp`` and owns the GPU physics
    # implementation; it is deliberately a separate optional extra rather
    # than a mode of the ``mujoco`` backend.
    "mujoco-warp==3.10.0.3",
    # Bound stays loose like mjlab's; the committed uv.lock pins warp-lang at
    # the 1.14.x line mjlab validates (mujoco-warp 3.10.0.3 only requires
    # warp-lang>=1.14). Upgrade deliberately via `uv lock --upgrade-package`.
    "warp-lang>=1.14.0",
]
motrix = ["motrixsim-core==0.8.2"]
genesis = [
    # Genesis imports as ``genesis`` and owns the GPU physics implementation;
    # it is a separate optional extra pinned exactly to the probed release
    # (scripts/tools/genesis_feasibility/REPORT.md, #1372).
    "genesis-world==1.3.3",
]
viser = ["viser>=1.0.26", "trimesh>=3.21.7"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pyright>=1.1.408"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "r2-cu130"
url = "https://download-r2.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "r2-cu130", marker = "sys_platform=='linux' and platform_machine=='aarch64'" },
    { index = "pytorch-cu128", marker = "sys_platform=='linux' and platform_machine=='x86_64'" },
    { index = "pytorch-cu128", marker = "sys_platform=='win32'" },
]

[tool.uv]
exclude-dependencies = ["torchvision"]
# Build mujoco-uni-runtime against the mujoco version locked in this project
# environment instead of an isolated build env (its native extension records
# the build-time mujoco version and refuses to load on mismatch). Prebuilt
# wheels on the index are bound to one specific mujoco build, so always
# compile from the sdist here. After changing the mujoco version, run
# `uv cache clean mujoco-uni-runtime && uv sync --extra mujoco
# --reinstall-package mujoco-uni-runtime` to force a fresh in-env build
# (uv's build cache cannot see that the extension depends on mujoco).
no-build-isolation-package = ["mujoco-uni-runtime"]
no-binary-package = ["mujoco-uni-runtime"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
extend-exclude = [".history"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",
    "N806",
    "E402",
    "F401",
    "N801",
    "F821",
    "E741",
    "N802",
    "N803",
    "N812",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_site_packages = true
exclude = [
    "src/unilab/algos/rsl_rl/", # vendored third-party, tracked in .gitignore
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running training or script smoke tests, or cumulatively expensive backend matrices",
]
addopts = "--tb=short -m 'not slow'"

[tool.coverage.run]
source = ["src/unilab"]
omit = ["*/rsl_rl/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
include = ["src/unilab"]
exclude = [
    "src/unilab/algos/rsl_rl/",       # vendored third-party
    "src/unilab/envs/",                     # mujoco-uni-runtime internal API, stubs mismatch
    "src/unilab/terrains/",                 # mujoco-uni-runtime MjSpec API, stubs mismatch
    "src/unilab/utils/monitoring.py",       # optional pynvml/psutil deps
    "src/unilab/visualization/",            # direct mujoco C bindings + optional viser deps
]
reportMissingImports = "warning"
reportMissingModuleSource = "none"
