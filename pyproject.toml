[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Robot meshes/textures are hosted on Hugging Face (unilabsim/unilab-robots)
# and downloaded into these paths on first use; keep them out of the
# wheel/sdist even when they exist in the source tree. XML and small metadata
# stay packaged. Directories must stay in sync with ROBOT_ASSET_SPECS in
# src/unilab/assets/hub.py.
source-exclude = [
    "/src/unilab/assets/robots/a2/assets",
    "/src/unilab/assets/robots/allegro_hand/assets",
    "/src/unilab/assets/robots/g1/assets",
    "/src/unilab/assets/robots/g1/textures",
    "/src/unilab/assets/robots/go1/assets",
    "/src/unilab/assets/robots/go2/assets",
    "/src/unilab/assets/robots/x2/meshes",
]

[project]
name = "unilab"
version = "1.1.0"
description = "Configurable, contract-driven robot learning across physics backends"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UniLab Authors" }]
keywords = ["robot-learning", "reinforcement-learning", "mujoco", "simulation"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy",
    # Physics implementations are provided by the independently released
    # unisim-core package from the production PyPI index.
    "unisim-core>=1.1.4",
    # RL algorithms and async runtimes (PPO/APPO/SAC/TD3 runners,
    # collectors, IPC, logging) live in the independently released uni-rl
    # package (distribution name ``unilab-rl``), consumed via the injected
    # env contract (uni_rl.env_contract.EnvFactory). Published on PyPI.
    "unilab-rl==1.1.1",
    "numba>=0.67",
    "prettytable>=3.10",
    # torch is a range (not an exact pin) so that published PyPI metadata lets
    # ROCm users substitute a rocm build installed from the PyTorch ROCm index
    # (install torch there first, then unilab; pip keeps the installed build).
    # Repo development and CI stay reproducible: uv.lock pins the tested
    # cu128/cu130 builds below via tool.uv.sources.
    "torch>=2.9,<2.12 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torch>=2.8,<2.12 ; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "gymnasium",
    "imageio",
    "etils",
    "hydra-core>=1.3",
    "tensordict",
    "rsl-rl-lib>=5.0.0",
    "packaging",
    "mediapy",
    # >=2.21 drops the pkg_resources import removed in setuptools>=82,
    # which otherwise breaks `uv run tensorboard` at startup.
    "tensorboard>=2.21.0",
    # Unpinned: quadrants (genesis-world 1.3.3 pin) requires setuptools>=77,
    # and nothing in this repo imports setuptools/pkg_resources at runtime.
    "setuptools",
    "rich",
    "tqdm",
    "typing-extensions",
    "lark>=1.3.1",
    "wandb",
    "onnxruntime<1.20 ; python_version < '3.11'",
    "onnxruntime>=1.20 ; python_version >= '3.11'",
    "huggingface_hub>=0.25",
    "ninja ; sys_platform == 'linux'",
    "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
train = "unilab.cli:train_main"
eval = "unilab.cli:eval_main"
demo = "unilab.cli:demo_main"
unilab-complete = "unilab.cli_completion:main"
unilab-viz-nan = "unilab.utils.nan_viz:main"
unilab-export-scene = "unisim.backend.mujoco.export_scene:main"
unilab-render-teaser = "unilab.visualization.teaser:main"
unilab-pull-assets = "unilab.assets.pull:main"

[project.urls]
Homepage = "https://unilabsim.github.io"
Documentation = "https://unilabsim.github.io/UniLab-doc/"
Repository = "https://github.com/unilabsim/UniLab"
Issues = "https://github.com/unilabsim/UniLab/issues"

[project.optional-dependencies]
drake = [
    # Python runtime for the Drake batch adapter. Drake C++ remains an external
    # toolchain and the native extension must be built against the local
    # DRAKE_HOME after this extra is synced.
    "drake-uni==0.1.0",
    # Drake playback always uses MuJoCo's native renderer (MuJoCo is never
    # stepped). Keep the renderer available from the single Drake install
    # path; the MuJoCo physics extension remains in the separate mujoco extra.
    "mujoco>=3.5",
]
mujoco = [
    # MuJoCo 3.11 alignment (unilabsim/UniLab#1515): the mujoco, mjwarp, and
    # newton extras share one MuJoCo 3.11 / MuJoCo-Warp 3.11 / warp-lang 1.16.0
    # line and are jointly installable. The `mujoco` bound is a compatible-
    # release specifier; `uv.lock` pins the exact MuJoCo version, and the
    # `mujoco-uni-runtime` pin is exact because each runtime release carries
    # exactly one prebuilt MuJoCo binding (its 0.5.0 wheels bind
    # mujoco==3.11.0; the runtime supports >=3.5,<3.12 via sdist rebuilds).
    # Switch to a non-default MuJoCo version via `make mujoco MJ=<version>`,
    # which forces a source rebuild of the runtime.
    "mujoco~=3.11.0",
    "mujoco-uni-runtime==0.5.0",
    # pybind11/wheel are build requirements of the mujoco-uni-runtime sdist
    # fallback build (see no-build-isolation-package below). The default
    # install path uses the prebuilt wheel and never invokes them, but they
    # must already be in the env when `make mujoco MJ=<version>` recompiles.
    "pybind11>=2.12",
    "wheel",
]
mjwarp = [
    # Keep the Warp backend on the same MuJoCo minor line as the host backend.
    # ``mujoco-warp`` imports as ``mujoco_warp`` and owns the GPU physics
    # implementation; it is deliberately a separate optional extra rather
    # than a mode of the ``mujoco`` backend. warp-lang stays an exact pin on
    # the 1.16.0 line shared with the newton extra.
    "mujoco-warp~=3.11.0",
    "warp-lang==1.16.0",
]
newton = [
    # Newton 1.5.1 is coupled to the MuJoCo-Warp 3.11 / Warp 1.16 line, so
    # these stay exact pins. They sit on the same 3.11 line as the mujoco and
    # mjwarp extras: newton 1.5.1 requires warp-lang>=1.16.0, and mujoco-warp
    # 3.11.0 accepts warp-lang>=1.14 and mujoco>=3.9.0, so warp-lang==1.16.0
    # satisfies all three extras in one joint environment.
    "newton==1.5.1",
    "mujoco-warp==3.11.0",
    "mujoco==3.11.0",
    "warp-lang==1.16.0",
    # Newton's MJCF importer loads mesh assets through trimesh on the
    # materialization cold path; newton does not declare it as a hard
    # dependency, so the extra carries it explicitly.
    "trimesh>=3.21.7",
    # Native ViewerGL is Newton's default playback renderer (offline record
    # and interactive), so keep its GUI stack in the same backend extra.
    "pyglet>=2.1.6,<3",
    "imgui-bundle>=1.92.0",
]
motrix = ["motrixsim-core==0.8.2"]
genesis = [
    # Genesis imports as ``genesis`` and owns the GPU physics implementation;
    # it is a separate optional extra pinned exactly to the probed release
    # (scripts/tools/genesis_feasibility/REPORT.md, #1372).
    "genesis-world==1.3.3",
]
viser = ["viser>=1.0.26", "trimesh>=3.21.7"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pyright>=1.1.408"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "r2-cu130"
url = "https://download-r2.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "r2-cu130", marker = "sys_platform=='linux' and platform_machine=='aarch64'" },
    { index = "pytorch-cu128", marker = "sys_platform=='linux' and platform_machine=='x86_64'" },
    { index = "pytorch-cu128", marker = "sys_platform=='win32'" },
]

[tool.uv]
exclude-dependencies = ["torchvision"]
# Only relevant if mujoco-uni-runtime is ever built from its sdist inside
# this project: the native extension must be compiled against the mujoco
# version installed in this environment rather than in an isolated build env,
# because it records the build-time mujoco version and refuses to load on
# mismatch. The sdist fallback path (`make mujoco MJ=<version>`) builds via
# `uv pip install --no-build-isolation` explicitly; this setting covers any
# other in-project build. The default install path resolves the prebuilt
# wheel (bound to mujoco==3.11.0) and never builds anything, so no compiler
# is needed for `make setup`.
no-build-isolation-package = ["mujoco-uni-runtime"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
extend-exclude = [".history"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",
    "N806",
    "E402",
    "F401",
    "N801",
    "F821",
    "E741",
    "N802",
    "N803",
    "N812",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_site_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running training or script smoke tests, or cumulatively expensive backend matrices",
]
addopts = "--tb=short -m 'not slow'"

[tool.coverage.run]
source = ["src/unilab"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
include = ["src/unilab"]
exclude = [
    "src/unilab/envs/",                     # mujoco-uni-runtime internal API, stubs mismatch
    "src/unilab/terrains/",                 # mujoco-uni-runtime MjSpec API, stubs mismatch
    "src/unilab/utils/monitoring.py",       # optional pynvml/psutil deps
    "src/unilab/visualization/",            # direct mujoco C bindings + optional viser deps
]
reportMissingImports = "warning"
reportMissingModuleSource = "none"
