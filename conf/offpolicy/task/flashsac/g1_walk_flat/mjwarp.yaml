# @package _global_
# Configured-only FlashSAC mjwarp owner. Mirrors the MuJoCo owner's algo /
# env / reward identity; mjwarp-specific host-adapter settings follow
# conf/offpolicy/task/sac/g1_walk_flat/mjwarp.yaml. Offline record reuses
# MuJoCo rendering; native playback and device-resident runtime are absent.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: mjwarp
  play_render_mode: record
algo:
  num_envs: 4096
  learning_starts: 49
  max_iterations: 5000
  save_interval: 1000
  updates_per_step: 8
  replay_buffer_n: 256
  tau: 0.05
env:
  mjwarp_nconmax: 128
  mjwarp_njmax: 256
  render_spacing: 2.0
  events:
    # Legacy mjwarp owners disable kp/kd and armature randomization.
    pd_gains: null
reward:
  penalty_action_rate:
    weight: -5.0
  penalty_feet_ori:
    weight: -25.0
  feet_phase:
    params:
      tracking_sigma: 0.005
  pose:
    params:
      pose_weights: [0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
