# @package _global_
# FlashSAC MuJoCo 23-DoF owner: 23-DoF offpolicy contract plus the FlashSAC
# algo identity and its reward retuning.
defaults:
  - /task/g1_23dof_walk_flat/base
  - _self_

training:
  task_name: G1Walk23DofFlat
  sim_backend: mujoco
algo:
  num_envs: 4096
  learning_starts: 49
  max_iterations: 5000
  save_interval: 1000
  updates_per_step: 8
  replay_buffer_n: 256
  tau: 0.05
reward:
  penalty_action_rate:
    weight: -5.0
  penalty_feet_ori:
    weight: -25.0
  feet_phase:
    params:
      tracking_sigma: 0.005
  pose:
    params:
      pose_weights: [0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
