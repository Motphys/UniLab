# @package _global_
# FlashSAC Motrix 23-DoF owner: mirrors flashsac/g1_walk_flat/motrix.yaml with
# the 23-DoF contract (algo identity kept, Motrix-direction retuning).
defaults:
  - /task/g1_23dof_walk_flat/base
  - _self_

training:
  task_name: G1Walk23DofFlat
  sim_backend: motrix
algo:
  num_envs: 4096
  learning_starts: 49
  max_iterations: 5000
  save_interval: 1000
  updates_per_step: 8
  replay_buffer_n: 256
  tau: 0.05
env:
  events:
    # Legacy Motrix owners disable kp/kd randomization.
    pd_gains: null
reward:
  tracking_lin_vel:
    weight: 2.2
  tracking_ang_vel:
    weight: 1.8
  penalty_ang_vel_xy:
    weight: -1.2
  penalty_orientation:
    weight: -12.0
  penalty_action_rate:
    weight: -2.5
  pose:
    weight: -0.6
    params:
      pose_weights: [0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
  penalty_feet_ori:
    weight: -5.0
  feet_phase:
    weight: 6.0
    params:
      tracking_sigma: 0.008
  alive:
    weight: 12.0
