# @package _global_
training:
  task_name: Go2FootStand
  sim_backend: drake
  no_play: true
  play_steps: 400
  play_env_num: 1
  play_render_mode: record

algo:
  algo_log_name: fast_sac_drake
  num_envs: 512
  batch_size: 1024
  replay_buffer_n: 512
  updates_per_step: 2
  learning_starts: 2
  max_iterations: 300
  save_interval: 100
  actor_hidden_dim: 256
  critic_hidden_dim: 512
  obs_normalization: true
  use_layer_norm: true
  algo_params:
    alpha_init: 0.005
    target_entropy_ratio: 0.0
    use_compile: false

env:
  sim_dt: 0.004
  drake_backend_mode: batch
  drake_nthread: 20
  add_body_sensors: true
  obs_history_len: 15
  energy_termination_threshold: 200.0
  noise_config:
    level: 1.0
    scale_joint_angle: 0.01
    scale_joint_vel: 1.5
    scale_gyro: 0.2
    scale_gravity: 0.05
    scale_linvel: 0.1
  control_config:
    action_scale: 0.3
  domain_rand:
    randomize_floor_friction: false
    randomize_link_mass: false
    torso_added_mass_range: null
    randomize_torso_com: false
    randomize_dof_armature: false
    randomize_reset_joint_qpos: true
    reset_joint_qpos_range: [-0.05, 0.05]

reward:
  scales:
    height: 2.0
    orientation: 2.0
    contact: -1.0
    action_rate: -0.01
    termination: -2.0
    dof_pos_limits: -0.5
    torques: 0.0
    pose: -0.1
    penalty_contact: -0.2
    tar: 0.8
    rear_feet_contact: 0.5
    rear_leg_symmetry: -0.2
    front_leg_motion: -0.05
    upright_stability: -0.2
    knee_clearance: -0.5
    stay_still: -0.1
    energy: -0.003
    dof_acc: -2.5e-7
  tracking_sigma: 0.25
  base_height_target: 0.3
  knee_height_target: 0.08
