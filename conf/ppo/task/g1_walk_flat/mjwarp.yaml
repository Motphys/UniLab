# @package _global_
# Configured-only mjwarp owner for the unified host contract adapter. Offline
# record reuses MuJoCo rendering; native playback and device-resident runtime
# routing are intentionally absent.
training:
  task_name: G1WalkFlat
  sim_backend: mjwarp
  no_play: false
  play_render_mode: record
algo:
  num_envs: 2048
  max_iterations: 2200
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
  policy:
    actor_hidden_dims: [512, 256, 128]
    critic_hidden_dims: [512, 256, 128]
env:
  numba_acceleration: false
  mjwarp_nconmax: 128
  mjwarp_njmax: 256
  domain_rand:
    randomize_kp: false
    randomize_kd: false
    randomize_dof_armature: false
    randomize_body_gravity_compensation: false
  control_config:
    action_scale: 0.25
  curriculum:
    enabled: false
  noise_config:
    level: 0.0
    scale_joint_angle: 0.01
    scale_joint_vel: 1.5
    scale_gyro: 0.2
reward:
  scales:
    tracking_lin_vel: 2.0
    tracking_ang_vel: 0.2
    feet_phase: 1.0
    lin_vel_z: -1.0
    ang_vel_xy: -0.25
    base_height: -500.0
    orientation: -5.0
    action_rate: -0.01
    pose: -0.1
  tracking_sigma: 0.25
  gait_frequency: 1.5
  feet_phase_swing_height: 0.09
  feet_phase_tracking_sigma: 0.008
  base_height_target: 0.754
  min_base_height: 0.55
  max_tilt_deg: 25.0
  pose_weights: [0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
play_profile:
  enabled: true
  env:
    render_spacing: 2.0
