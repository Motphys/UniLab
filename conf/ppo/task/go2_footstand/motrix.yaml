# @package _global_
defaults:
  - /task/go2_footstand/base
  - _self_

training:
  task_name: Go2FootStand
  sim_backend: motrix
  no_play: true

env:
  events:
    reset_joints:
      params:
        position_offset_range: [-0.02, 0.02]
    # Unsupported model-field payloads remain explicitly disabled for Motrix.
    floor_friction: null
    link_mass: null
    torso_com: null
    joint_armature: null

algo:
  empirical_normalization: true
  num_envs: 4096
  max_iterations: 10000
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    init_noise_std: 0.5
  algorithm:
    entropy_coef: 0.005

reward:
  footstand:
    params:
      scales:
        height: 2.0
        orientation: 3.0
        contact: -1.0
        action_rate: -0.01
        termination: -2.0
        dof_pos_limits: -0.5
        torques: 0.0
        pose: -0.1
        penalty_contact: -0.2
        tar: 1.3
        rear_feet_contact: 0.5
        both_rear_feet_contact: 0.25
        rear_foot_slip: -1.0
        rear_foot_anchor: -0.15
        front_feet_air: 0.0
        balanced_footstand: 0.0
        rear_leg_symmetry: -0.2
        rear_leg_splay: -0.25
        front_leg_motion: -0.06
        front_leg_crossing: -2.0
        upright_stability: -0.2
        knee_clearance: -0.5
        stay_still: -0.12
        energy: -0.003
        dof_acc: -2.5e-7
      front_feet_min_separation: 0.18
      front_feet_side_margin: 0.06
      rear_hip_abduction_margin: 0.25
      rear_foot_slip_deadband: 0.012
      rear_foot_anchor_radius: 0.04
