# @package _global_
# Canonical Pollen Robotics MicroDuck Manager-Based velocity task (off-policy owners).
# Environment, command, event, termination, and reward semantics are identical to
# the on-policy owner (conf/ppo/task/microduck_velocity_flat/base.yaml); backend
# owner leaves inherit this file and only carry backend/algo identity.
env:
  scene:
    model_file: src/unilab/assets/robots/microduck/scene_flat.xml
    fragment_files: [src/unilab/assets/robots/microduck/locomotion_task.xml]
    default_keyframe_name: home
    entities:
      robot:
        root_body_name: trunk_base
        joint_names:
          - left_hip_yaw
          - left_hip_roll
          - left_hip_pitch
          - left_knee
          - left_ankle
          - neck_pitch
          - head_pitch
          - head_yaw
          - head_roll
          - right_hip_yaw
          - right_hip_roll
          - right_hip_pitch
          - right_knee
          - right_ankle
        actuator_names:
          - left_hip_yaw
          - left_hip_roll
          - left_hip_pitch
          - left_knee
          - left_ankle
          - neck_pitch
          - head_pitch
          - head_yaw
          - head_roll
          - right_hip_yaw
          - right_hip_roll
          - right_hip_pitch
          - right_knee
          - right_ankle
        body_names: [trunk_base]
  sim_dt: 0.01
  ctrl_dt: 0.02
  max_episode_seconds: 20.0
  observations:
    policy:
      enable_corruption: true
      terms:
        base_ang_vel:
          func: unilab.envs.mdp.builtin_sensor
          params: {sensor_name: gyro}
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.03
            n_max: 0.03
            operation: add
        projected_gravity:
          func: unilab.envs.mdp.projected_gravity_from_sensor
          params: {sensor_name: upvector}
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.01
            n_max: 0.01
            operation: add
        joint_pos:
          func: unilab.envs.mdp.joint_pos_rel
          params: {biased: true}
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.001
            n_max: 0.001
            operation: add
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.25
            n_max: 0.25
            operation: add
        actions:
          func: unilab.envs.mdp.last_action
          params: {action_name: joint_pos}
        twist_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: twist}
        head_pose_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: head_pose}
        body_pose_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: body_pose}
    critic:
      terms:
        base_ang_vel:
          func: unilab.envs.mdp.builtin_sensor
          params: {sensor_name: gyro}
        projected_gravity:
          func: unilab.envs.mdp.projected_gravity_from_sensor
          params: {sensor_name: upvector}
        joint_pos:
          func: unilab.envs.mdp.joint_pos_rel
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
        actions:
          func: unilab.envs.mdp.last_action
          params: {action_name: joint_pos}
        twist_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: twist}
        head_pose_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: head_pose}
        body_pose_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: body_pose}
        base_lin_vel:
          func: unilab.envs.mdp.builtin_sensor
          params: {sensor_name: local_linvel}
  actions:
    joint_pos:
      _target_: unilab.envs.mdp.JointPositionActionCfg
      entity_name: robot
      actuator_names: [".*"]
      scale: 1.0
      use_default_offset: true
  commands:
    twist:
      _target_: unilab.tasks.locomotion.microduck.manager_terms.MicroduckVelocityCommandCfg
      entity_name: robot
      resampling_time_range: [20.0, 20.0]
      heading_command: false
      heading_control_stiffness: 0.5
      rel_standing_envs: 0.02
      rel_heading_envs: 0.0
      rel_world_envs: 0.0
      rel_forward_envs: 0.0
      init_velocity_prob: 0.0
      turn_in_place_fraction: 0.0
      turn_in_place_ang_min: 0.4
      ranges:
        lin_vel_x: [-0.2, 0.2]
        lin_vel_y: [-0.1, 0.1]
        ang_vel_z: [-0.5, 0.5]
    head_pose:
      _target_: unilab.tasks.locomotion.microduck.manager_terms.UniformVectorCommandCfg
      resampling_time_range: [2.0, 5.0]
      ranges:
        - [-0.05, 0.05]
        - [-0.05, 0.05]
        - [-0.07, 0.07]
        - [-0.015, 0.015]
    body_pose:
      _target_: unilab.tasks.locomotion.microduck.manager_terms.UniformVectorCommandCfg
      resampling_time_range: [2.0, 5.0]
      ranges:
        - [-0.005, 0.005]
        - [-0.005, 0.005]
        - [-0.005, 0.005]
        - [-0.05, 0.05]
        - [-0.05, 0.05]
        - [-0.05, 0.05]
  events:
    reset_scene_to_default:
      func: unilab.envs.mdp.reset_scene_to_default
      mode: reset
    base_com:
      func: unilab.envs.mdp.randomize_rigid_body_com
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          body_names: trunk_base
        com_range:
          x: [-0.003, 0.003]
          y: [-0.003, 0.003]
          z: [-0.003, 0.003]
    encoder_bias:
      func: unilab.envs.mdp.randomize_encoder_bias
      mode: reset
      params:
        bias_range: [-0.015, 0.015]
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          joint_names: ".*"
    push_robot:
      func: unilab.envs.mdp.push_by_setting_velocity
      mode: interval
      interval_range_s: [3.0, 3.0]
      is_global_time: true
      params:
        velocity_range:
          x: [-0.3, 0.3]
          y: [-0.3, 0.3]
          z: [0.0, 0.0]
          roll: [0.0, 0.0]
          pitch: [0.0, 0.0]
          yaw: [0.0, 0.0]
  terminations:
    time_out:
      func: unilab.envs.mdp.time_out
      time_out: true
    tilt:
      func: unilab.envs.mdp.bad_orientation
      params: {limit_angle: 0.7853981633974483}
    base_height:
      func: unilab.envs.mdp.root_height_below_minimum
      params: {minimum_height: 0.08}
  policy_observation_group: policy
  critic_observation_group: critic

reward:
  tracking_lin_vel:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.track_lin_vel
    weight: 3.0
    params: {sensor_name: local_linvel, tracking_sigma: 0.25, command_name: twist}
  tracking_ang_vel:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.track_ang_vel
    weight: 1.5
    params: {sensor_name: gyro, tracking_sigma: 0.25, command_name: twist}
  head_pose_tracking:
    func: unilab.tasks.locomotion.microduck.manager_terms.head_pose_tracking
    weight: 0.5
    params:
      command_name: head_pose
      std: 0.5
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        joint_names: [neck_pitch, head_pitch, head_yaw, head_roll]
        preserve_order: true
  head_pose_bias:
    func: unilab.tasks.locomotion.microduck.manager_terms.head_pose_bias
    weight: 0.0
    params:
      command_name: head_pose
      tau_s: 1.0
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        joint_names: [neck_pitch, head_pitch, head_yaw, head_roll]
        preserve_order: true
  leg_pose:
    func: unilab.tasks.locomotion.microduck.manager_terms.leg_pose
    weight: 1.0
    params:
      command_name: twist
      std_standing: 0.1
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        joint_names: [left_hip_yaw, left_hip_roll, left_hip_pitch, left_knee, left_ankle, right_hip_yaw, right_hip_roll, right_hip_pitch, right_knee, right_ankle]
        preserve_order: true
  foot_air_time_biped:
    func: unilab.tasks.locomotion.microduck.manager_terms.foot_air_time_biped
    weight: 2.0
    params: {threshold: 0.3, command_threshold: 0.01, command_name: twist}
  flight_phase:
    func: unilab.tasks.locomotion.microduck.manager_terms.flight_phase
    weight: -2.0
  lin_vel_z:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.lin_vel_z
    weight: -1.0
    params: {sensor_name: local_linvel}
  ang_vel_xy:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.ang_vel_xy
    weight: -0.05
    params: {sensor_name: gyro}
  orientation:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.orientation
    weight: -3.0
    params: {sensor_name: upvector}
  base_height:
    func: unilab.tasks.locomotion.common.manager_terms.base_height_l2
    weight: -50.0
    params: {target_height: 0.12}
  action_rate:
    func: unilab.envs.mdp.action_rate_l2
    weight: -0.5
  alive:
    func: unilab.tasks.locomotion.common.manager_terms.alive
    weight: 10.0
