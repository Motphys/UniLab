# @package _global_
# SAC MuJoCo 23-DoF owner: inherits the 23-DoF off-policy Manager-Based
# contract and only carries backend/algo identity.
defaults:
  - /task/g1_23dof_walk_flat/base
  - _self_

training:
  task_name: G1Walk23DofFlat
  sim_backend: mujoco
algo:
  num_envs: 2048
  learning_starts: 10
  max_iterations: 5000
  save_interval: 1000
  updates_per_step: 8
  use_symmetry: true
  algo_params:
    alpha_init: 0.001
    target_entropy_ratio: 0.0
