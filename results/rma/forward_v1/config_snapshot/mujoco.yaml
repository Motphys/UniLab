# @package _global_
defaults:
  - /task/go2_joystick_flat/base
  - _self_

training:
  task_name: Go2JoystickFlat
  sim_backend: mujoco
algo:
  num_envs: 1024
  max_iterations: 151
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  actor:
    obs_normalization: true
    distribution_cfg:
      init_std: 0.5
  critic:
    obs_normalization: true
  algorithm:
    learning_rate: 3.0e-4
    entropy_coef: 1.0e-3
play_profile:
  enabled: true
  env:
    render_spacing: 2.0
