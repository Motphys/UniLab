# @package _global_
# Deployment-aligned WarpSAC G1 whole-body-tracking owner.  This owner keeps
# the canonical motion task identity but changes the actor contract to match
# deploy_ws: no estimated anchor position or base linear velocity, pelvis IMU
# angular velocity, and five-step proprioception/action history.  An automatic
# four-stage curriculum reaches the deployment DR target; angular pushes remain
# disabled because mjwarp does not advertise interval angular-velocity
# randomization.
defaults:
  - /task/g1_motion_tracking/mujoco
  - _self_

training:
  task_name: G1WBTObs
  sim_backend: mjwarp
  play_render_mode: record

algo:
  num_envs: 2048
  max_iterations: 40000
  save_interval: 1000
  gamma: 0.99
  tau: 0.05
  updates_per_step: 4
  policy_frequency: 2
  actor_hidden_dim: 256
  critic_hidden_dim: 512
  num_atoms: 301
  # Keep replay uniform, matching the WarpSAC G1 motion owner.  This isolates
  # the deployment-contract/DR change from replay-scheduling changes.
  decay_step: 0
  replay_min_weight: 0.05
  algo_params:
    temp_target_sigma: 0.3

env:
  sim_dt: 0.005
  scene:
    entities:
      robot:
        geom_names:
          - left_foot1_collision
          - left_foot2_collision
          - left_foot3_collision
          - left_foot4_collision
          - left_foot5_collision
          - left_foot6_collision
          - left_foot7_collision
          - right_foot1_collision
          - right_foot2_collision
          - right_foot3_collision
          - right_foot4_collision
          - right_foot5_collision
          - right_foot6_collision
          - right_foot7_collision
  observations:
    actor:
      terms:
        motion_anchor_pos_b: null
        motion_anchor_ori_b:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_anchor_ori_b
          params: {command_name: motion}
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.05
            n_max: 0.05
        base_lin_vel: null
        base_ang_vel:
          func: unilab.envs.mdp.builtin_sensor
          params: {sensor_name: pelvis_gyro}
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.2
            n_max: 0.2
          history_length: 5
        joint_pos:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_pos_rel_biased
          params: {command_name: motion}
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.01
            n_max: 0.01
          history_length: 5
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.5
            n_max: 0.5
          history_length: 5
        actions:
          func: unilab.envs.mdp.last_action
          history_length: 5
    critic:
      terms:
        base_ang_vel:
          params: {sensor_name: pelvis_gyro}
  actions:
    joint_pos:
      simulate_action_latency: true
  terminations:
    anchor_pos:
      params: {command_name: motion, threshold: 0.4}
    ee_body_pos:
      params:
        command_name: motion
        threshold: 0.5
        body_names:
          - left_ankle_roll_link
          - right_ankle_roll_link
          - left_wrist_yaw_link
          - right_wrist_yaw_link
  events:
    base_mass:
      func: unilab.envs.mdp.randomize_rigid_body_mass
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          body_names: pelvis
        mass_distribution_params: [-1.0, 1.0]
        operation: add
        recompute_inertia: false
    base_com:
      func: unilab.envs.mdp.randomize_rigid_body_com
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          body_names: pelvis
        com_range:
          x: [-0.05, 0.05]
          y: [-0.05, 0.05]
          z: [-0.05, 0.05]
    pd_gains:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range: [0.9, 1.1]
        kd_range: [0.85, 1.15]
        operation: scale
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names: ".*"
    foot_friction:
      func: unilab.envs.mdp.geom_friction
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          geom_names: "^(left|right)_foot[1-7]_collision$"
        ranges: [0.3, 1.2]
        operation: abs
        shared_random: true
    encoder_bias:
      func: unilab.envs.mdp.randomize_encoder_bias
      mode: reset
      params:
        bias_range: [-0.01, 0.01]
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          joint_names: ".*"
    push_robot:
      func: unilab.envs.mdp.push_by_setting_velocity
      mode: interval
      interval_range_s: [4.0, 4.0]
      is_global_time: true
      params:
        velocity_range:
          x: [-0.18, 0.18]
          y: [-0.18, 0.18]
          z: [-0.072, 0.072]
          roll: [0.0, 0.0]
          pitch: [0.0, 0.0]
          yaw: [0.0, 0.0]
  curriculum:
    base_mass_dr:
      func: unilab.envs.mdp.event_curriculum
      params:
        event_name: base_mass
        stages:
          - {step: 0, params: {mass_distribution_params: [0.0, 0.0]}}
          - {step: 8000, params: {mass_distribution_params: [-0.3, 0.3]}}
          - {step: 16000, params: {mass_distribution_params: [-0.5, 0.5]}}
          - {step: 28000, params: {mass_distribution_params: [-1.0, 1.0]}}
    base_com_dr:
      func: unilab.envs.mdp.event_curriculum
      params:
        event_name: base_com
        stages:
          - step: 0
            params:
              com_range: {x: [0.0, 0.0], y: [0.0, 0.0], z: [0.0, 0.0]}
          - step: 8000
            params:
              com_range: {x: [-0.015, 0.015], y: [-0.015, 0.015], z: [-0.015, 0.015]}
          - step: 16000
            params:
              com_range: {x: [-0.025, 0.025], y: [-0.025, 0.025], z: [-0.025, 0.025]}
          - step: 28000
            params:
              com_range: {x: [-0.05, 0.05], y: [-0.05, 0.05], z: [-0.05, 0.05]}
    pd_gains_dr:
      func: unilab.envs.mdp.event_curriculum
      params:
        event_name: pd_gains
        stages:
          - {step: 0, params: {kp_range: [1.0, 1.0], kd_range: [1.0, 1.0]}}
          - {step: 8000, params: {kp_range: [0.95, 1.05], kd_range: [0.925, 1.075]}}
          - {step: 16000, params: {kp_range: [0.95, 1.05], kd_range: [0.9, 1.1]}}
          - {step: 28000, params: {kp_range: [0.9, 1.1], kd_range: [0.85, 1.15]}}
    foot_friction_dr:
      func: unilab.envs.mdp.event_curriculum
      params:
        event_name: foot_friction
        stages:
          - {step: 0, params: {ranges: [0.6, 0.6]}}
          - {step: 8000, params: {ranges: [0.5, 1.0]}}
          - {step: 16000, params: {ranges: [0.4, 1.1]}}
          - {step: 28000, params: {ranges: [0.3, 1.2]}}
    encoder_bias_dr:
      func: unilab.envs.mdp.event_curriculum
      params:
        event_name: encoder_bias
        stages:
          - {step: 0, params: {bias_range: [0.0, 0.0]}}
          - {step: 8000, params: {bias_range: [-0.005, 0.005]}}
          - {step: 16000, params: {bias_range: [-0.008, 0.008]}}
          - {step: 28000, params: {bias_range: [-0.01, 0.01]}}
    push_robot_dr:
      func: unilab.envs.mdp.event_curriculum
      params:
        event_name: push_robot
        stages:
          - step: 0
            params:
              velocity_range: {x: [0.0, 0.0], y: [0.0, 0.0], z: [0.0, 0.0], roll: [0.0, 0.0], pitch: [0.0, 0.0], yaw: [0.0, 0.0]}
          - step: 8000
            params:
              velocity_range: {x: [-0.05, 0.05], y: [-0.05, 0.05], z: [-0.02, 0.02], roll: [0.0, 0.0], pitch: [0.0, 0.0], yaw: [0.0, 0.0]}
          - step: 16000
            params:
              velocity_range: {x: [-0.09, 0.09], y: [-0.09, 0.09], z: [-0.036, 0.036], roll: [0.0, 0.0], pitch: [0.0, 0.0], yaw: [0.0, 0.0]}
          - step: 28000
            params:
              velocity_range: {x: [-0.18, 0.18], y: [-0.18, 0.18], z: [-0.072, 0.072], roll: [0.0, 0.0], pitch: [0.0, 0.0], yaw: [0.0, 0.0]}
    deployment_dr_stage:
      func: unilab.tasks.motion_tracking.common.manager_terms.deployment_dr_stage
      params:
        stages:
          - {step: 0, stage: 0}
          - {step: 8000, stage: 1}
          - {step: 16000, stage: 2}
          - {step: 28000, stage: 3}

reward:
  motion_global_root_pos:
    weight: 0.25
  motion_global_root_ori:
    weight: 0.5
  motion_body_pos:
    weight: 1.5
  motion_body_ori:
    params: {std: 0.6}
  motion_body_lin_vel:
    weight: 0.25
  motion_body_ang_vel:
    weight: 0.25
  motion_joint_pos:
    weight: 1.0
    params: {std: 0.3}
  motion_joint_vel:
    weight: 0.05
  action_rate_l2:
    weight: -0.1
  joint_limit:
    weight: -5.0
  joint_acc_l2:
    func: unilab.tasks.motion_tracking.g1.manager_terms.joint_acc_l2
    weight: -2.5e-7
  joint_torque_l2:
    func: unilab.tasks.motion_tracking.g1.manager_terms.joint_torque_l2
    weight: -1.0e-5
    params: {action_name: joint_pos}
