# @package _global_
# Velocity-emphasis sibling of the wide-kernel warm-up.
#
# Keep the deploy actor layout unchanged, but make velocity terms both
# differentiable at the initial error scale and large enough to beat the
# body-pose shortcut seen in v4/v5.  Promote only if raw velocity and joint
# tracking rise together; the wide std values are a warm-up diagnostic.
defaults:
  - /task/g1_wbt_obs_v5_wide_tracking/mjwarp
  - _self_

reward:
  motion_global_root_pos:
    weight: 1.0
    params: {std: 0.6}
  motion_global_root_ori:
    weight: 1.0
    params: {std: 0.8}
  motion_body_pos:
    weight: 0.5
    params: {std: 0.6}
  motion_body_ori:
    weight: 0.5
    params: {std: 0.8}
  motion_body_lin_vel:
    weight: 2.0
    params: {std: 4.0}
  motion_body_ang_vel:
    weight: 2.0
    params: {std: 10.0}
  motion_joint_pos:
    weight: 2.0
    params: {std: 0.6}
  motion_joint_vel:
    weight: 1.0
    params: {std: 4.0}
