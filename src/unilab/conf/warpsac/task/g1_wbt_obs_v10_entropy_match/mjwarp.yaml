# @package _global_
# Match WarpSAC's entropy target to the observed tanh-policy log-prob scale.
#
# v9 used temp_target_sigma=0.55, which resolves to a target entropy well
# above the entropy attainable by this 29-D tanh policy.  The temperature then
# grew to 4--7 before the first kernel transition.  Keep the v6 kernel
# curriculum and velocity-emphasis reward, but use an explicit target entropy
# measured from the v9 runs so temperature is not driven into that basin.
defaults:
  - /task/g1_wbt_obs_v6_velocity_kernel_curriculum/mjwarp
  - _self_

algo:
  algo_params:
    temp_initial_value: 0.1
    temp_target_sigma: 0.55
    temp_target_entropy: 19.5
