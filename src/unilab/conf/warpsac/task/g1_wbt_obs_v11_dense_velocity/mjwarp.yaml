# @package _global_
# Dense velocity-gradient experiment.
#
# v10 kept temperature stable but the 10k playback still fell and joint/body
# velocity tracking stayed near zero.  The exponential terms have almost no
# gradient at the initial velocity error.  Add fixed-scale negative MSE terms
# so the actor receives a useful velocity gradient while preserving the
# deploy-compatible actor and the v10 entropy/kernel schedule.
defaults:
  - /task/g1_wbt_obs_v10_entropy_match/mjwarp
  - _self_

reward:
  motion_body_lin_vel_l2:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_body_linear_velocity_error_l2
    weight: 1.0
    params: {command_name: motion, scale: 4.0}
  motion_body_ang_vel_l2:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_body_angular_velocity_error_l2
    weight: 0.5
    params: {command_name: motion, scale: 10.0}
  motion_joint_vel_l2:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_velocity_error_l2
    weight: 0.5
    params: {command_name: motion, scale: 4.0}
