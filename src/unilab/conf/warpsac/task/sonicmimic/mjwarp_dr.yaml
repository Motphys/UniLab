# @package _global_
# SONICMimic with static full-strength deployment DR from reset 0.
# The no-DR uniform owner remains separate; all ranges are static from reset 0.
defaults:
  - /task/sonicmimic/mjwarp
  - _self_

training:
  task_name: G1SonicMimicDR
  sim_backend: mjwarp
  play_render_mode: record

algo:
  max_iterations: 50000
  save_interval: 5000

env:
  observations:
    actor:
      enable_corruption: true
      terms:
        base_ang_vel:
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.2
            n_max: 0.2
        joint_pos:
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.01
            n_max: 0.01
        joint_vel:
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.5
            n_max: 0.5
    critic:
      terms:
        # Privileged critic observations are clean; corruption is actor-only.
        base_lin_vel:
          noise: null
        base_ang_vel:
          noise: null
        joint_pos:
          noise: null
        joint_vel:
          noise: null
  scene:
    entities:
      robot:
        geom_names:
          - left_foot1_collision
          - left_foot2_collision
          - left_foot3_collision
          - left_foot4_collision
          - left_foot5_collision
          - left_foot6_collision
          - left_foot7_collision
          - right_foot1_collision
          - right_foot2_collision
          - right_foot3_collision
          - right_foot4_collision
          - right_foot5_collision
          - right_foot6_collision
          - right_foot7_collision
  actions:
    joint_pos:
      simulate_action_latency: true
  events:
    base_mass:
      func: unilab.envs.mdp.randomize_rigid_body_mass
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          body_names: pelvis
        mass_distribution_params: [-1.0, 1.0]
        operation: add
        recompute_inertia: false
    base_com:
      func: unilab.envs.mdp.randomize_rigid_body_com
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          body_names: pelvis
        com_range:
          x: [-0.05, 0.05]
          y: [-0.05, 0.05]
          z: [-0.05, 0.05]
    pd_gains:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range: [0.9, 1.1]
        kd_range: [0.85, 1.15]
        operation: scale
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names: ".*"
    foot_friction:
      func: unilab.envs.mdp.geom_friction
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          geom_names: "^(left|right)_foot[1-7]_collision$"
        ranges: [0.3, 1.2]
        operation: abs
        shared_random: true
    encoder_bias:
      func: unilab.envs.mdp.randomize_encoder_bias
      mode: reset
      params:
        bias_range: [-0.01, 0.01]
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          joint_names: ".*"
    push_robot:
      func: unilab.envs.mdp.push_by_setting_velocity
      mode: interval
      interval_range_s: [4.0, 4.0]
      is_global_time: true
      params:
        velocity_range:
          x: [-0.18, 0.18]
          y: [-0.18, 0.18]
          z: [-0.072, 0.072]
          roll: [0.0, 0.0]
          pitch: [0.0, 0.0]
          yaw: [0.0, 0.0]
