# @package _global_
# Canonical G1 Whole-Body Tracking (WBT) Manager-Based task declaration for
# FlashSAC owners. Env/reward semantics match
# conf/sac/task/g1_motion_tracking/mujoco.yaml so the sim2sim DENYLIST
# contract keeps parity across backends; the observation groups follow the
# mimic-lite tracking layout (future-step reference windows + proprio for the
# actor, plus privileged ref/diff terms for the critic) instead of the SAC
# tree's observation set. Backend owner leaves inherit this file and only
# override backend/algo tuning.
env:
  seed: null
  scene:
    model_file: src/unilab/assets/robots/g1/scene_flat.xml
    default_keyframe_name: stand
    entities:
      robot:
        root_body_name: pelvis
        joint_names: &g1_joints
          - left_hip_pitch_joint
          - left_hip_roll_joint
          - left_hip_yaw_joint
          - left_knee_joint
          - left_ankle_pitch_joint
          - left_ankle_roll_joint
          - right_hip_pitch_joint
          - right_hip_roll_joint
          - right_hip_yaw_joint
          - right_knee_joint
          - right_ankle_pitch_joint
          - right_ankle_roll_joint
          - waist_yaw_joint
          - waist_roll_joint
          - waist_pitch_joint
          - left_shoulder_pitch_joint
          - left_shoulder_roll_joint
          - left_shoulder_yaw_joint
          - left_elbow_joint
          - left_wrist_roll_joint
          - left_wrist_pitch_joint
          - left_wrist_yaw_joint
          - right_shoulder_pitch_joint
          - right_shoulder_roll_joint
          - right_shoulder_yaw_joint
          - right_elbow_joint
          - right_wrist_roll_joint
          - right_wrist_pitch_joint
          - right_wrist_yaw_joint
        actuator_names: *g1_joints
        # 16 bodies: the 14 reward-tracking bodies (mirrored verbatim in
        # commands.motion.params.body_names) plus the two shoulder-yaw links
        # the mimic-lite observation body set needs.
        body_names:
          - pelvis
          - left_hip_roll_link
          - left_knee_link
          - left_ankle_roll_link
          - right_hip_roll_link
          - right_knee_link
          - right_ankle_roll_link
          - torso_link
          - left_shoulder_roll_link
          - left_elbow_link
          - left_wrist_yaw_link
          - right_shoulder_roll_link
          - right_elbow_link
          - right_wrist_yaw_link
          - left_shoulder_yaw_link
          - right_shoulder_yaw_link
  sim_dt: 0.006666666666666667
  ctrl_dt: 0.02
  max_episode_seconds: 10.0
  observations:
    # mimic-lite-style observation groups. Actor: future-step reference
    # windows (frames [-8, -4, -2, 0, 1, 2, 3, 4] at the 50 Hz control rate)
    # plus single-step proprio; noise is Gaussian clamped at 3 sigma, matching
    # mimic-lite's `randn.clamp(-3, 3) * std`. Critic: the (shared) actor
    # terms plus privileged reference/diff terms over the 9-body obs set and
    # the applied action/torque.
    actor:
      enable_corruption: true
      terms:
        ref_root_pos_future_local: &ref_root_pos_future_local_obs
          func: unilab.tasks.motion_tracking.common.obs_terms.ref_root_pos_future_local
          params: {command_name: motion, future_steps: [-8, -4, -2, 0, 1, 2, 3, 4]}
          noise:
            _target_: unilab.managers._noise.GaussianNoiseCfg
            std: 0.005
            clamp: 3.0
        ref_root_ori_future_b: &ref_root_ori_future_b_obs
          func: unilab.tasks.motion_tracking.common.obs_terms.ref_root_ori_future_b
          params: {command_name: motion, future_steps: [-8, -4, -2, 0, 1, 2, 3, 4]}
          noise:
            _target_: unilab.managers._noise.GaussianNoiseCfg
            std: 0.05
            clamp: 3.0
        ref_joint_pos_future: &ref_joint_pos_future_obs
          func: unilab.tasks.motion_tracking.common.obs_terms.ref_joint_pos_future
          params: {command_name: motion, future_steps: [-8, -4, -2, 0, 1, 2, 3, 4]}
          noise:
            _target_: unilab.managers._noise.GaussianNoiseCfg
            std: 0.01
            clamp: 3.0
        base_ang_vel: &base_ang_vel_obs
          func: unilab.envs.mdp.builtin_sensor
          params: {sensor_name: torso_gyro}
          noise:
            _target_: unilab.managers._noise.GaussianNoiseCfg
            std: 0.2
            clamp: 3.0
        projected_gravity: &projected_gravity_obs
          func: unilab.envs.mdp.projected_gravity
          noise:
            _target_: unilab.managers._noise.GaussianNoiseCfg
            std: 0.01
            clamp: 3.0
        joint_pos: &joint_pos_obs
          func: unilab.tasks.motion_tracking.common.obs_terms.motion_joint_pos
          params: {command_name: motion}
          noise:
            _target_: unilab.managers._noise.GaussianNoiseCfg
            std: 0.02
            clamp: 3.0
        joint_vel: &joint_vel_obs
          func: unilab.tasks.motion_tracking.common.obs_terms.motion_joint_vel
          params: {command_name: motion}
          noise:
            _target_: unilab.managers._noise.GaussianNoiseCfg
            std: 0.5
            clamp: 3.0
        last_action: &last_action_obs
          func: unilab.envs.mdp.last_action
    critic:
      # Corruption mirrors mimic-lite, where the critic consumes the same
      # noised policy observations; the privileged terms carry no noise.
      enable_corruption: true
      terms:
        ref_root_pos_future_local: *ref_root_pos_future_local_obs
        ref_root_ori_future_b: *ref_root_ori_future_b_obs
        ref_joint_pos_future: *ref_joint_pos_future_obs
        base_ang_vel: *base_ang_vel_obs
        projected_gravity: *projected_gravity_obs
        joint_pos: *joint_pos_obs
        joint_vel: *joint_vel_obs
        last_action: *last_action_obs
        ref_root_pos_future_b:
          func: unilab.tasks.motion_tracking.common.obs_terms.ref_root_pos_future_b
          params: {command_name: motion, future_steps: [-8, -4, -2, 0, 1, 2, 3, 4]}
        diff_body_pos_future_local:
          func: unilab.tasks.motion_tracking.common.obs_terms.diff_body_pos_future_local
          params: {command_name: motion, future_steps: [0, 1]}
        diff_body_ori_future_local:
          func: unilab.tasks.motion_tracking.common.obs_terms.diff_body_ori_future_local
          params: {command_name: motion, future_steps: [0, 1]}
        diff_body_lin_vel_future:
          func: unilab.tasks.motion_tracking.common.obs_terms.diff_body_lin_vel_future
          params: {command_name: motion, future_steps: [0, 1]}
        diff_body_ang_vel_future:
          func: unilab.tasks.motion_tracking.common.obs_terms.diff_body_ang_vel_future
          params: {command_name: motion, future_steps: [0, 1]}
        applied_action:
          func: unilab.tasks.motion_tracking.common.obs_terms.motion_applied_action
        applied_torque:
          func: unilab.tasks.motion_tracking.common.obs_terms.motion_applied_torque
          params: {command_name: motion}
  actions:
    joint_pos:
      _target_: unilab.tasks.motion_tracking.common.manager_terms.MotionJointPositionActionCfg
      entity_name: robot
      actuator_names: [".*"]
      scale: 2.0
      use_default_offset: true
      command_name: motion
  commands:
    motion:
      _target_: unilab.tasks.motion_tracking.common.manager_terms.MotionCommandCfg
      entity_name: robot
      resampling_time_range: [1.0e9, 1.0e9]
      params:
        motion_file: motions/g1/dance1_subject2_part.npz
        anchor_body_name: torso_link
        # Reward-facing tracked bodies (14); must mirror the first 14 entries
        # of env.scene.entities.robot.body_names.
        body_names:
          - pelvis
          - left_hip_roll_link
          - left_knee_link
          - left_ankle_roll_link
          - right_hip_roll_link
          - right_knee_link
          - right_ankle_roll_link
          - torso_link
          - left_shoulder_roll_link
          - left_elbow_link
          - left_wrist_yaw_link
          - right_shoulder_roll_link
          - right_elbow_link
          - right_wrist_yaw_link
        # mimic-lite observation body set (9 on this G1 model: no toe_link,
        # matching mimic-lite's intersection with available bodies).
        obs_body_names:
          - pelvis
          - left_knee_link
          - right_knee_link
          - left_shoulder_yaw_link
          - right_shoulder_yaw_link
          - left_elbow_link
          - right_elbow_link
          - left_wrist_yaw_link
          - right_wrist_yaw_link
        obs_root_body_name: pelvis
        sampling_mode: adaptive
        sampling_start_ratio: 0.0
        truncate_on_clip_end: true
        pose_range:
          x: [-0.05, 0.05]
          y: [-0.05, 0.05]
          z: [-0.01, 0.01]
          roll: [-0.1, 0.1]
          pitch: [-0.1, 0.1]
          yaw: [-0.2, 0.2]
        velocity_range:
          x: [-0.5, 0.5]
          y: [-0.5, 0.5]
          z: [-0.2, 0.2]
          roll: [-0.52, 0.52]
          pitch: [-0.52, 0.52]
          yaw: [-0.78, 0.78]
        joint_position_range: [-0.1, 0.1]
        joint_default_position_range: [0.0, 0.0]
  terminations:
    time_out:
      func: unilab.envs.mdp.time_out
      time_out: true
    motion_clip_end:
      func: unilab.tasks.motion_tracking.common.manager_terms.motion_clip_end
      time_out: true
      params: {command_name: motion}
    anchor_pos:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_anchor_pos_z_only
      params: {command_name: motion, threshold: 0.5}
    anchor_ori:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_anchor_ori
      params:
        command_name: motion
        threshold: 0.8
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
    ee_body_pos:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_motion_body_pos_z_only
      params:
        command_name: motion
        threshold: 0.5
        body_names:
          - left_ankle_roll_link
          - right_ankle_roll_link
          - left_wrist_yaw_link
          - right_wrist_yaw_link
  policy_observation_group: actor
  critic_observation_group: critic

reward:
  motion_global_root_pos:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_anchor_position_error_exp
    weight: 1.0
    params: {command_name: motion, std: 0.3}
  motion_global_root_ori:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_anchor_orientation_error_exp
    weight: 0.5
    params: {command_name: motion, std: 0.4}
  motion_body_pos:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_relative_body_position_error_exp
    weight: 2.0
    params: {command_name: motion, std: 0.3}
  motion_body_ori:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_relative_body_orientation_error_exp
    weight: 1.0
    params: {command_name: motion, std: 0.4}
  motion_body_lin_vel:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_body_linear_velocity_error_exp
    weight: 1.0
    params: {command_name: motion, std: 1.0}
  motion_body_ang_vel:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_body_angular_velocity_error_exp
    weight: 1.0
    params: {command_name: motion, std: 3.14}
  motion_joint_pos:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_position_error_exp
    weight: 0.0
    params: {command_name: motion, std: 0.2}
  motion_joint_vel:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_velocity_error_exp
    weight: 0.0
    params: {command_name: motion, std: 1.0}
  # KDTO+T torque tracking (SPARK): disabled by default via weight 0.0, the
  # repo's reward-term off switch (RewardManager skips zero-weight terms).
  # Enable on a torque-reference NPZ with
  # `reward.motion_joint_torque.weight=1.0`; the term returns zeros when the
  # motion file carries no joint_torque/joint_torque_limit fields.
  motion_joint_torque:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_torque
    weight: 0.0
    params: {command_name: motion, std: 0.5}
  action_rate_l2:
    func: unilab.envs.mdp.action_rate_l2
    weight: -0.1
  joint_limit:
    func: unilab.tasks.motion_tracking.common.manager_terms.joint_pos_limits
    weight: -2.0
    params:
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        joint_names: ".*"
  undesired_contacts:
    func: unilab.tasks.motion_tracking.common.manager_terms.undesired_body_contacts
    weight: -0.1
    params:
      command_name: motion
      threshold: 0.05
      body_names:
        - pelvis
        - left_hip_roll_link
        - left_knee_link
        - right_hip_roll_link
        - right_knee_link
        - torso_link
        - left_shoulder_roll_link
        - left_elbow_link
        - right_shoulder_roll_link
        - right_elbow_link
