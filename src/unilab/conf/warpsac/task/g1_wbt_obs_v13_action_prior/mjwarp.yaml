# @package _global_
# Deploy-compatible action-prior warm-up.
#
# The actor already receives the 58-D reference joint position/velocity command,
# but the RL objective can have a nearly-flat gradient before the robot moves.
# This owner adds a temporary dense prior on the normalized joint-position
# action and anneals it before the first deployment DR stage.  It changes no
# actor input, so the eventual policy remains 514 -> 29 deployable.
defaults:
  - /task/g1_wbt_obs_v11_dense_velocity/mjwarp
  - _self_

env:
  curriculum:
    action_prior_anneal:
      func: unilab.envs.mdp.reward_curriculum
      params:
        reward_name: motion_joint_action_prior_l2
        stages:
          - {step: 0, weight: 1.0}
          - {step: 8000, weight: 0.5}
          - {step: 16000, weight: 0.2}
          - {step: 20000, weight: 0.0}

reward:
  motion_joint_action_prior_l2:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_action_prior_l2
    weight: 1.0
    params:
      command_name: motion
      action_name: joint_pos
      scale: 0.5
