# @package _global_
# Second deployment-aligned WarpSAC owner.  It keeps the 514-d deploy contract,
# restores the FastSAC task-space reward balance, and gives the no-DR policy a
# substantially longer pretraining phase before deployment DR is introduced.
defaults:
  - /task/g1_wbt_obs/mjwarp
  - _self_

training:
  task_name: G1WBTObs
  sim_backend: mjwarp
  play_render_mode: record

algo:
  num_envs: 2048
  batch_size: 2048
  learning_starts: 98
  max_iterations: 140000
  save_interval: 1000

  # Align the representation budget with the deployable FastSAC reference.
  # Depth remains two blocks; this widens the existing blocks only.
  actor_hidden_dim: 512
  critic_hidden_dim: 768
  num_atoms: 501

env:
  curriculum:
    base_mass_dr:
      params:
        stages:
          - {step: 0, params: {mass_distribution_params: [0.0, 0.0]}}
          - {step: 20000, params: {mass_distribution_params: [-0.3, 0.3]}}
          - {step: 40000, params: {mass_distribution_params: [-0.5, 0.5]}}
          - {step: 60000, params: {mass_distribution_params: [-1.0, 1.0]}}
    base_com_dr:
      params:
        stages:
          - step: 0
            params:
              com_range: {x: [0.0, 0.0], y: [0.0, 0.0], z: [0.0, 0.0]}
          - step: 20000
            params:
              com_range: {x: [-0.015, 0.015], y: [-0.015, 0.015], z: [-0.015, 0.015]}
          - step: 40000
            params:
              com_range: {x: [-0.025, 0.025], y: [-0.025, 0.025], z: [-0.025, 0.025]}
          - step: 60000
            params:
              com_range: {x: [-0.05, 0.05], y: [-0.05, 0.05], z: [-0.05, 0.05]}
    pd_gains_dr:
      params:
        stages:
          - {step: 0, params: {kp_range: [1.0, 1.0], kd_range: [1.0, 1.0]}}
          - {step: 20000, params: {kp_range: [0.95, 1.05], kd_range: [0.925, 1.075]}}
          - {step: 40000, params: {kp_range: [0.95, 1.05], kd_range: [0.9, 1.1]}}
          - {step: 60000, params: {kp_range: [0.9, 1.1], kd_range: [0.85, 1.15]}}
    foot_friction_dr:
      params:
        stages:
          - {step: 0, params: {ranges: [0.6, 0.6]}}
          - {step: 20000, params: {ranges: [0.5, 1.0]}}
          - {step: 40000, params: {ranges: [0.4, 1.1]}}
          - {step: 60000, params: {ranges: [0.3, 1.2]}}
    encoder_bias_dr:
      params:
        stages:
          - {step: 0, params: {bias_range: [0.0, 0.0]}}
          - {step: 20000, params: {bias_range: [-0.005, 0.005]}}
          - {step: 40000, params: {bias_range: [-0.008, 0.008]}}
          - {step: 60000, params: {bias_range: [-0.01, 0.01]}}
    push_robot_dr:
      params:
        stages:
          - step: 0
            params:
              velocity_range: {x: [0.0, 0.0], y: [0.0, 0.0], z: [0.0, 0.0], roll: [0.0, 0.0], pitch: [0.0, 0.0], yaw: [0.0, 0.0]}
          - step: 20000
            params:
              velocity_range: {x: [-0.05, 0.05], y: [-0.05, 0.05], z: [-0.02, 0.02], roll: [0.0, 0.0], pitch: [0.0, 0.0], yaw: [0.0, 0.0]}
          - step: 40000
            params:
              velocity_range: {x: [-0.09, 0.09], y: [-0.09, 0.09], z: [-0.036, 0.036], roll: [0.0, 0.0], pitch: [0.0, 0.0], yaw: [0.0, 0.0]}
          - step: 60000
            params:
              velocity_range: {x: [-0.18, 0.18], y: [-0.18, 0.18], z: [-0.072, 0.072], roll: [0.0, 0.0], pitch: [0.0, 0.0], yaw: [0.0, 0.0]}
    deployment_dr_stage:
      params:
        stages:
          - {step: 0, stage: 0}
          - {step: 20000, stage: 1}
          - {step: 40000, stage: 2}
          - {step: 60000, stage: 3}

reward:
  # Restore root/velocity stabilization while retaining direct joint tracking.
  # The v1 owner over-weighted pose/joint imitation and under-weighted drift and
  # velocity, which produced an action outline with sway and drift.
  motion_global_root_pos:
    weight: 1.0
  motion_global_root_ori:
    weight: 1.0
  motion_body_pos:
    weight: 1.0
  motion_body_ori:
    params: {std: 0.4}
  motion_body_lin_vel:
    weight: 1.0
  motion_body_ang_vel:
    weight: 1.0
  motion_joint_pos:
    weight: 1.0
    params: {std: 0.3}
  motion_joint_vel:
    weight: 0.05
