defaults:
  - _self_
  - task: g1_walk_flat/mujoco

algo:
  algo: warpsac
  algo_log_name: warp_sac
  load_run: "-1"
  seed: 1
  num_envs: 1024
  batch_size: 2048
  replay_buffer_n: 512
  updates_per_step: 2
  learning_starts: 98
  policy_frequency: 2
  target_frequency: 1
  max_iterations: 5000
  save_interval: 1000
  gamma: 0.97
  tau: 0.01
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  actor_hidden_dim: 128
  critic_hidden_dim: 256
  num_atoms: 101
  obs_normalization: false
  use_layer_norm: false
  decay_step: 512
  replay_min_weight: 0.05
  replay_num_buckets: 2000
  actor_normalize_parameters: true
  critic_normalize_parameters: true
  algo_params:
    normalize_reward: true
    normalized_g_max: 5.0
    actor_num_blocks: 2
    critic_num_blocks: 2
    actor_bc_alpha: 0.0
    actor_noise_zeta_mu: 2.0
    actor_noise_zeta_max: 16
    critic_min_v: -5.0
    critic_max_v: 5.0
    temp_initial_value: 0.01
    temp_target_sigma: 0.15
    temp_target_entropy: null
    learning_rate_init: 3.0e-4
    learning_rate_peak: 3.0e-4
    learning_rate_end: 1.5e-4
    learning_rate_warmup_steps: 0
    learning_rate_decay_steps: 500000
    n_step: 1
    amp_dtype: auto
    use_compile: true
    compile_full_objectives: true

training:
  task_name: G1WalkFlat
  devices: null
  dp_collector_cpu_ids: null
  logger: tensorboard
  # Backend (TensorBoard/wandb) scalar reporting interval in iterations; the
  # terminal display is unaffected. Each report is one batched event record.
  log_interval: 1
  wandb_project: unilab
  wandb_entity: null
  wandb_group: null
  wandb_job_type: null
  wandb_name: null
  wandb_tags: []
  wandb_notes: null
  wandb_mode: null
  sim_backend: mujoco
  nan_guard:
    enabled: true
    buffer_size: 100
    max_envs_to_dump: 5
    output_dir: null
  use_amp: true
  play_only: false
  no_play: false
  sim2sim_strict: true
  play_render_mode: auto
  export_onnx: true
  play_env_num: 16
  play_steps: 800
  cam_distance: 6.0
  cam_elevation: -20.0
  cam_azimuth: 90.0
  log_root: null
  log_dir: null
  env_steps_per_sync: 1
  inference_request_timeout_sec: 30.0
  trace_enabled: false
  trace_output_dir: null
  trace_thread_time: false
  trace_cuda_events: true
  nvtx_profile_ranges: false
  replay_prefetch_mode: one_tick
  torch_threads:
    enabled: true
    learner_num_threads: auto
    collector_num_threads: auto
    learner_num_interop_threads: 1
    collector_num_interop_threads: 1
    compile_threads: auto
    set_env_vars: true

interactive:
  action_mode: zero
  policy_obs_mode: auto
  show_target_bodies: false
  show_reward_debug: false
  target_show_axes: false
  target_body_names: ""
  target_max_bodies: 0
  target_marker_radius: 0.02
  target_axis_length: 0.08
  target_marker_alpha: 0.75
  reward_debug_show_velocity: false
  reward_debug_lin_vel_scale: 0.08
  reward_debug_ang_vel_scale: 0.05
  reward_debug_show_connectors: false
  reward_debug_show_global_anchor: false
  camera_follow_body: true
  camera_focus_body_name: ""
  camera_height_offset: 0.15
  camera_distance: null
  camera_elevation: null
  camera_azimuth: null
  use_env_visual_model: true
  speed: 1.0
  start_paused: false
  keyboard: false
  keyboard_step_lin: 0.1
  keyboard_step_ang: 0.2

viser:
  port: 8080
  env_idx: 0
  display_mode: all
  max_envs: 16

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]
