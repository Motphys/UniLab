# @package _global_
# FlashSAC MuJoCo owner: inherits the 29-DoF off-policy Manager-Based contract
# and the FlashSAC training budget from the shared base and carries this
# owner's reward retuning (stiffer action-rate / feet-orientation penalties,
# tighter feet-phase sigma).
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: mujoco
reward:
  penalty_action_rate:
    weight: -5.0
  penalty_feet_ori:
    weight: -25.0
  feet_phase:
    params:
      tracking_sigma: 0.005
  pose:
    params:
      pose_weights: [0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
env:
  reset_owners:
    walk:
      _target_: unilab.tasks.locomotion.g1.manager_terms.G1WalkResetOwnerCfg
      func: unilab.tasks.locomotion.g1.manager_terms.G1WalkResetOwner
      command_name: twist
  events:
    reset_scene_to_default:
      func: unilab.envs.mdp.skip_scene_reset
    reset_root_state_uniform:
      func: unilab.envs.mdp.reset_root_state_uniform_fused
