# @package _global_
# Configured-only FlashSAC mjwarp owner. Mirrors the MuJoCo owner's reward
# retuning; the FlashSAC training budget is inherited from the shared base.
# mjwarp-specific host-adapter settings follow
# conf/sac/task/g1_walk_flat/mjwarp.yaml. Offline record reuses
# MuJoCo rendering; interactive eval routes through the MuJoCo viewer.
# Native playback and device-resident runtime are absent.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: mjwarp
  play_render_mode: record
env:
  # MJWarp is DEVICE_RESIDENT/DIRECT. Mirror the SAC owner's CUDA tensor
  # lifecycle so this owner-selected path does not depend on caller defaults.
  mjwarp_nconmax: 128
  mjwarp_njmax: 256
  render_spacing: 2.0
  events:
    reset_scene_to_default:
      func: unilab.envs.mdp.skip_scene_reset
    reset_root_state_uniform:
      func: unilab.envs.mdp.reset_root_state_uniform_fused
    # kp/kd and armature randomization stay disabled, matching the tuned walk baseline.
    pd_gains: null
reward:
  penalty_action_rate:
    weight: -5.0
  penalty_feet_ori:
    weight: -25.0
  feet_phase:
    params:
      tracking_sigma: 0.005
  pose:
    params:
      pose_weights: [0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
