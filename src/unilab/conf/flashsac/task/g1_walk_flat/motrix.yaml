# @package _global_
# FlashSAC Motrix owner: inherits the FlashSAC training budget from the
# shared base and adopts the Motrix-direction reward retuning; kp/kd
# randomization is enabled like the MuJoCo owner — the MotrixSim 1.0.0
# adapter declares the RESET_TERM_KP/KD reset terms.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: motrix
env:
  reset_owners:
    walk:
      _target_: unilab.tasks.locomotion.g1.manager_terms.G1WalkResetOwnerCfg
      func: unilab.tasks.locomotion.g1.manager_terms.G1WalkResetOwner
      command_name: twist
reward:
  tracking_lin_vel:
    weight: 2.2
  tracking_ang_vel:
    weight: 1.8
  penalty_ang_vel_xy:
    weight: -1.2
  penalty_orientation:
    weight: -12.0
  penalty_action_rate:
    weight: -2.5
  pose:
    weight: -0.6
    params:
      pose_weights: [0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
  penalty_feet_ori:
    weight: -5.0
  feet_phase:
    weight: 6.0
    params:
      tracking_sigma: 0.008
  alive:
    weight: 12.0
