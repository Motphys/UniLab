# @package _global_
# FlashSAC mjwarp (GPU) owner for G1 WBT. The command carrier stays on MJWarp's
# device-resident tensor path; canonical Manager terms own observations,
# rewards, terminations, and reset lifecycle.
defaults:
  - /task/g1_motion_tracking/mujoco
  - _self_

training:
  task_name: G1MotionTracking
  sim_backend: mjwarp
  play_render_mode: record
  # Reduce metric D2H frequency for the scoped tensor benchmark; capacity
  # remains CLI-overridable so ring depth can be measured without task forks.
  collector_metrics_interval: 100
