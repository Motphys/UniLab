# @package _global_
# FlashSAC Motrix owner for G1 WBT. MotrixSim is CPU-authoritative; the Manager
# read/write lifecycle crosses the public packed HOST_BRIDGE boundary only.
# Keep DENYLIST parity with the MuJoCo owner so cross-backend checkpoints
# transfer 1:1. Motrix tensor reset does not support randomization or fixed
# variants; this owner enables neither. The tensor command carrier mirrors the
# MuJoCo HOST_BRIDGE path; canonical Manager terms own reset lifecycle.
defaults:
  - /task/g1_motion_tracking/mujoco
  - _self_

training:
  task_name: G1MotionTracking
  sim_backend: motrix
  play_render_mode: record
