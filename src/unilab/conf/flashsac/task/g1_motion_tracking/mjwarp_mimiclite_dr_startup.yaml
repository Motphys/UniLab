# @package _global_
# Startup mass/COM owner: an opt-in performance variant of mjwarp_mimiclite_dr.
#
# body_mass and body_com use mode=startup: each environment keeps one fixed
# mass/COM draw for the entire run. The startup commit is full-width, so the
# expensive mujoco-warp derived-constant refresh happens once at construction
# instead of after every resetting row on steady-state steps.
#
# Coverage trade-off (this is not a drop-in replacement for reset mode):
# - only num_envs parameter points receive training signal; regions between or
#   outside those draws are not continuously explored;
# - a difficult fixed environment can be oversampled in early replay because it
#   terminates more often;
# - the per-reset owner remains the coverage-complete default.
#
# Everything else is inherited unchanged from mjwarp_mimiclite_dr.
defaults:
  - /task/g1_motion_tracking/mjwarp_mimiclite_dr
  - _self_

training:
  task_name: G1MotionTracking
  sim_backend: mjwarp

env:
  events:
    body_mass:
      mode: startup
    body_com:
      mode: startup
