# @package _global_
# Newton owner for the G1 walk Manager-Based contract.  Newton's runtime is
# optional and isolated from the historical mujoco/mjwarp extras; process
# device binding supplies the rank-local CUDA device when ``newton_device`` is
# left unset.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: newton
  # Native ViewerGL rendering (offline record + interactive) is provided by
  # the backend; playback inherits the base config's auto mode (interactive
  # with a display, record otherwise).

algo:
  num_envs: 2048
  max_iterations: 2200
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
  policy:
    actor_hidden_dims: [512, 256, 128]
    critic_hidden_dims: [512, 256, 128]

env:
  # Newton/MuJoCo-Warp 3.11 owns explicit device and storage capacities.  A
  # null device is intentional: the off-policy collector binder injects the
  # rank-local CUDA device before materialization.  320/512 leaves headroom
  # over the observed fall-contact demand (broadphase up to ~258 contacts,
  # nefc 269) measured with the runtime capacity guard.
  newton_device: null
  newton_nconmax: 320
  newton_njmax: 512
  newton_capacity_check_steps: 1
  events:
    # Newton currently rejects runtime PD gain randomization; keep the owner
    # fail-closed until that adapter capability is added.
    pd_gains: null

play_profile:
  enabled: false

