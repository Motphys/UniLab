# @package _global_
# Genesis owner for the in-process backend (genesis-world==1.3.3, torch>=2.8).
# Keeps DENYLIST parity with the MuJoCo owner so cross-backend play transfers
# 1:1. Genesis drops the MJCF global <option> block at import (REPORT #1372
# §3.3), so the integrator g1.xml declares (<option integrator="implicitfast"
# timestep="0.006666666666666667"/>) is re-declared here: the timestep flows
# through the existing base.yaml sim_dt -> ctrl_dt chain, and the integrator
# through the EnvCfg genesis fields below. Solver/constraint-cone/iterations
# stay at Genesis defaults: the MJCF option block does not declare them and
# MuJoCo's implicit defaults (PGS solver, pyramidal cone) have no Genesis
# equivalent. Keyframes and sensors are scanned from the MJCF once on the
# materialize cold path; kp/kd reset randomization stays enabled because the
# backend declares the measured RESET_TERM_KP/KD DR terms (REPORT §5.7).
# Playback uses Genesis native rendering: with a display, play_render_mode=auto
# opens the interactive viewer; headless hosts fall back to offscreen camera
# recording.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: genesis
  play_render_mode: auto
algo:
  num_envs: 2048
  max_iterations: 2200
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
  policy:
    actor_hidden_dims: [512, 256, 128]
    critic_hidden_dims: [512, 256, 128]
env:
  # GPU device id for the process-wide Genesis session.  Multi-GPU training
  # overrides this cold-path field from the rank topology; zero preserves the
  # single-device owner default.  A non-zero id pins CUDA_VISIBLE_DEVICES for
  # the whole process before the first CUDA context exists (Quadrants only
  # honors the first visible device), after which the in-process index is 0.
  genesis_device_id: 0
  # Re-declares the MJCF <option integrator="implicitfast"> that Genesis drops
  # at import; the remaining global options keep the Genesis defaults.
  genesis_integrator: implicitfast
play_profile:
  enabled: true
  env:
    render_spacing: 2.0
