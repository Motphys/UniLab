# @package _global_
# IsaacGym owner for the subprocess backend (physics runs in a Python 3.8
# worker). Keeps DENYLIST parity with the MuJoCo owner so cross-backend play
# transfers 1:1. The backend consumes the self-contained MJCF scene from
# base.yaml directly (scene fragments and generated terrain are unsupported)
# and scans keyframes/sensors/actuators from it on the materialize cold path,
# reproducing the <position kp kv forcerange> actuators with PhysX
# DOF_MODE_POS. Runtime kp/kd randomization is unsupported, so pd_gains
# stays disabled. Playback uses IsaacGym native rendering: with a display,
# `play_render_mode=auto` opens the interactive viewer; headless hosts fall
# back to offscreen camera-sensor recording.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: isaacgym
algo:
  num_envs: 2048
  max_iterations: 2200
  empirical_normalization: false
  obs_groups:
    actor:
      - actor
  policy:
    actor_hidden_dims: [512, 256, 128]
    critic_hidden_dims: [512, 256, 128]
env:
  # GPU device index handed to the worker sim; unset defaults to device 0.
  isaacgym_device_id: 0
  events:
    # Runtime kp/kd randomization is unsupported on the isaacgym worker.
    pd_gains: null
play_profile:
  enabled: true
  env:
    render_spacing: 2.0
