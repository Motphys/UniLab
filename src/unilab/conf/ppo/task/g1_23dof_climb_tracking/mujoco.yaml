# @package _global_
defaults:
  - /task/g1_23dof_motion_tracking/mujoco
  - _self_

training:
  task_name: G1ClimbTracking23Dof
  sim_backend: mujoco
  play_steps: 1000

algo:
  num_envs: 1024
  max_iterations: 20000
  save_interval: 500
  empirical_normalization: true
  obs_groups:
    actor: [actor]
    critic: [critic]
  algorithm:
    entropy_coef: 0.005
    desired_kl: 0.01

play_profile:
  enabled: false
  env: null

env:
  scene:
    model_file: src/unilab/assets/robots/g1/scene_climb_20_z_scale_1_23dof.xml
  sim_dt: 0.005
  max_episode_seconds: 15.0
  actions:
    joint_pos:
      scale:
        ".*_(hip_pitch|hip_yaw)_joint": 0.5475464629911068
        ".*_(hip_roll|knee)_joint": 0.35066146637882434
        ".*_ankle_(pitch|roll)_joint": 0.43857731392336724
        "waist_yaw_joint": 0.5475464629911068
        ".*_(shoulder_(pitch|roll|yaw)|elbow|wrist_roll)_joint": 0.43857731392336724
  commands:
    motion:
      params:
        motion_file: motions/g1/climb_20_z_scale_1.0_23dof.npz
        sampling_mode: adaptive
        truncate_on_clip_end: false
  terminations:
    anchor_pos:
      params: {command_name: motion, threshold: 0.3}
    ee_body_pos:
      params:
        command_name: motion
        threshold: 0.3
        body_names: &ee_bodies
          - left_ankle_roll_link
          - right_ankle_roll_link
          - left_wrist_roll_rubber_hand
          - right_wrist_roll_rubber_hand
    undesired_contacts:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_undesired_body_contacts
      params:
        command_name: motion
        threshold: 0.05
        body_names: &undesired_bodies
          - pelvis
          - left_hip_roll_link
          - left_knee_link
          - right_hip_roll_link
          - right_knee_link
          - torso_link
          - left_shoulder_roll_link
          - left_elbow_link
          - right_shoulder_roll_link
          - right_elbow_link

reward:
  motion_body_pos:
    weight: 2.0
  motion_body_ori:
    weight: 1.5
  motion_ee_body_pos_z:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_relative_body_position_z_error_exp
    weight: 2.0
    params: {command_name: motion, std: 0.3, body_names: *ee_bodies}
  motion_joint_pos:
    weight: 0.5
  motion_joint_vel:
    weight: 0.25
  action_rate_l2:
    weight: -0.005
  undesired_contacts:
    func: unilab.tasks.motion_tracking.common.manager_terms.undesired_body_contacts
    weight: -0.1
    params: {command_name: motion, threshold: 0.05, body_names: *undesired_bodies}
