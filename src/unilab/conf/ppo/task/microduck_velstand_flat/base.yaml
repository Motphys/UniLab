# @package _global_
# MicroDuck VelStand task: walking + fall recovery in one policy, ported from
# the upstream microduck_rl microduck_velstand_env_cfg.py (anchor commit
# 29e887e). Built on the BAM velocity recipe (task/microduck_velocity_bam_flat,
# issue #1474): observations, commands, DR events and the walk reward layer are
# item-for-item identical. Deltas:
#   - Robot = ground-contact BAM XML (body shells collide, so the robot can
#     physically lie down and push off the floor).
#   - head_pose_bias gains the upstream upright gate (height + tilt smoothstep).
#   - air_time switches to feet_air_time_upright (zeroed while fallen).
#   - Recovery layer: upright_progress / height_progress / com_upward_velocity
#     / fallen_tax / recovery_success / joint_torque_rate_l2.
#   - random_prone_init reset event (prone + crouch slices, curriculum-ramped).
#   - fallen_too_long backstop termination; fell_over (tilt) disabled by
#     curriculum at iter 500.
# mjwarp has no owner: the BAM substep state-feedback contract is unavailable
# there (host_numpy profile raises NotImplementedError).
env:
  scene:
    model_file: src/unilab/assets/robots/microduck/scene_flat_groundcontact_bam.xml
    fragment_files: [src/unilab/assets/robots/microduck/locomotion_task.xml]
    default_keyframe_name: home
    entities:
      robot:
        root_body_name: trunk_base
        joint_names:
          - left_hip_yaw
          - left_hip_roll
          - left_hip_pitch
          - left_knee
          - left_ankle
          - neck_pitch
          - head_pitch
          - head_yaw
          - head_roll
          - right_hip_yaw
          - right_hip_roll
          - right_hip_pitch
          - right_knee
          - right_ankle
        actuator_names:
          - left_hip_yaw
          - left_hip_roll
          - left_hip_pitch
          - left_knee
          - left_ankle
          - neck_pitch
          - head_pitch
          - head_yaw
          - head_roll
          - right_hip_yaw
          - right_hip_roll
          - right_hip_pitch
          - right_knee
          - right_ankle
        # trunk_base: root + trunk CoM DR; ankle_*: foot clearance/swing/slip and
        # critic foot_height; neck chain + bearing_roll: legacy head CoM DR set.
        body_names:
          - trunk_base
          - ankle_left
          - ankle_right
          - neck
          - neck_pitch
          - yaw_roll_motion
          - jaw_soft
          - bearing_roll
        # Foot collision geoms for the foot_friction DR event.
        geom_names: [left_foot_collision, right_foot_collision]
  # Upstream recipe: 200 Hz physics under 50 Hz control (substeps = ctrl_dt / sim_dt = 4).
  sim_dt: 0.005
  ctrl_dt: 0.02
  max_episode_seconds: 20.0
  observations:
    policy:
      enable_corruption: true
      terms:
        base_ang_vel:
          func: unilab.envs.mdp.base_ang_vel_imu_misaligned
          params: {max_angle_deg: 6.0}
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.03
            n_max: 0.03
            operation: add
          # Legacy IMU latency envelope: 0-1 ctrl step lag, resampled every 64 steps.
          delay_min_lag: 0
          delay_max_lag: 1
          delay_update_period: 64
        projected_gravity:
          func: unilab.envs.mdp.projected_gravity_imu_misaligned
          params: {max_angle_deg: 6.0}
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.01
            n_max: 0.01
            operation: add
          delay_min_lag: 0
          delay_max_lag: 1
          delay_update_period: 64
        joint_pos:
          func: unilab.envs.mdp.joint_pos_rel
          params: {biased: true}
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.001
            n_max: 0.001
            operation: add
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.25
            n_max: 0.25
            operation: add
          # Legacy fixed 1-ctrl-step (20 ms) joint-velocity lag (Dynamixel
          # firmware moving-average velocity estimate).
          delay_min_lag: 1
          delay_max_lag: 1
        actions:
          func: unilab.envs.mdp.last_action
          params: {action_name: joint_pos}
        twist_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: twist}
        head_pose_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: head_pose}
        body_pose_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: body_pose}
    critic:
      terms:
        base_ang_vel:
          func: unilab.envs.mdp.builtin_sensor
          params: {sensor_name: gyro}
        projected_gravity:
          func: unilab.envs.mdp.projected_gravity_from_sensor
          params: {sensor_name: upvector}
        joint_pos:
          func: unilab.envs.mdp.joint_pos_rel
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
        actions:
          func: unilab.envs.mdp.last_action
          params: {action_name: joint_pos}
        twist_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: twist}
        head_pose_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: head_pose}
        body_pose_command:
          func: unilab.envs.mdp.generated_commands
          params: {command_name: body_pose}
        base_lin_vel:
          func: unilab.envs.mdp.builtin_sensor
          params: {sensor_name: local_linvel}
        # Privileged per-foot terms (legacy critic 76D layout).
        foot_height:
          func: unilab.tasks.locomotion.common.gait_terms.foot_height
          params:
            asset_cfg:
              _target_: unilab.managers.SceneEntityCfg
              name: robot
              body_names: [ankle_left, ankle_right]
              preserve_order: true
        foot_air_time:
          func: unilab.tasks.locomotion.common.gait_terms.foot_air_time
          params:
            sensor_groups: [[left_foot_contact], [right_foot_contact]]
        foot_contact:
          func: unilab.tasks.locomotion.common.gait_terms.foot_contact
          params:
            sensor_groups: [[left_foot_contact], [right_foot_contact]]
        foot_contact_forces:
          func: unilab.tasks.locomotion.common.gait_terms.foot_contact_forces
          params:
            sensor_groups: [[left_foot_contact], [right_foot_contact]]
  actions:
    joint_pos:
      # Upstream bam xl330-m6 (microduck_rl microduck_constants.py): kp_fw=200,
      # vin ~ U(6.5, 8.2) sampled once at startup, load-dependent sag
      # vin_drop_gain ~ U(0.0, 0.2) V/Nm floored at 6.0 V, command delay lag ~
      # U{3..6} physics substeps resampled every substep, friction budget
      # scaled per episode by U(0.9, 1.1). The fitted electrical/friction
      # constants stay at the dataclass defaults (= bam params xl330/m6.json).
      _target_: unilab.tasks.locomotion.microduck.bam_action.BamVoltageActionCfg
      entity_name: robot
      actuator_names: [".*"]
      scale: 1.0
      kp_fw: 200.0
      vin_range: [6.5, 8.2]
      vin_drop_gain_range: [0.0, 0.2]
      vin_min: 6.0
      delay_min_lag: 3
      delay_max_lag: 6
      friction_scale_range: [0.9, 1.1]
  commands:
    twist:
      _target_: unilab.tasks.locomotion.microduck.manager_terms.MicroduckVelocityCommandCfg
      entity_name: robot
      resampling_time_range: [3.0, 8.0]
      heading_command: false
      heading_control_stiffness: 0.5
      rel_standing_envs: 0.02
      rel_heading_envs: 0.0
      rel_world_envs: 0.0
      rel_forward_envs: 0.2
      init_velocity_prob: 0.0
      turn_in_place_fraction: 0.15
      turn_in_place_ang_min: 0.4
      ranges:
        lin_vel_x: [-0.4, 0.4]
        lin_vel_y: [-0.3, 0.3]
        ang_vel_z: [-1.0, 1.0]
    head_pose:
      _target_: unilab.envs.mdp.UniformPoseCommandCfg
      resampling_time_range: [2.0, 5.0]
      ranges:
        - [-0.05, 0.05]
        - [-0.05, 0.05]
        - [-0.07, 0.07]
        - [-0.015, 0.015]
    body_pose:
      _target_: unilab.envs.mdp.UniformPoseCommandCfg
      resampling_time_range: [2.0, 5.0]
      ranges:
        - [-0.005, 0.005]
        - [-0.005, 0.005]
        - [-0.005, 0.005]
        - [-0.05, 0.05]
        - [-0.05, 0.05]
        - [-0.05, 0.05]
  events:
    reset_scene_to_default:
      func: unilab.envs.mdp.reset_scene_to_default
      mode: reset
    # Upstream reset_base: uniform root offsets around the `home` keyframe —
    # xy ±0.5 m, yaw ±π, z +[0, 0.01] on the keyframe z=0.12 (absolute
    # z ∈ [0.12, 0.13]); velocities stay zero and joints return to HOME
    # exactly (reset_scene_to_default above stages the keyframe state first).
    reset_base:
      func: unilab.envs.mdp.reset_root_state_uniform
      mode: reset
      params:
        pose_range:
          x: [-0.5, 0.5]
          y: [-0.5, 0.5]
          z: [0.0, 0.01]
          yaw: [-3.141592653589793, 3.141592653589793]
        velocity_range: {}
    base_com:
      func: unilab.envs.mdp.randomize_rigid_body_com
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          body_names: trunk_base
        com_range:
          x: [-0.003, 0.003]
          y: [-0.003, 0.003]
          z: [-0.003, 0.003]
    head_com:
      func: unilab.envs.mdp.randomize_rigid_body_com
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          # Legacy HEAD_BODY_NAMES resolved against this model: the head-roll
          # body is jaw_soft here (bottom_head_shell in the legacy walk model).
          body_names: [neck, neck_pitch, yaw_roll_motion, jaw_soft, bearing_roll]
        com_range:
          x: [-0.003, 0.003]
          y: [-0.003, 0.003]
          z: [-0.003, 0.003]
    encoder_bias:
      func: unilab.envs.mdp.randomize_encoder_bias
      mode: reset
      params:
        bias_range: [-0.015, 0.015]
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          joint_names: ".*"
    foot_friction:
      func: unilab.envs.mdp.geom_friction
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          geom_names: [left_foot_collision, right_foot_collision]
        ranges: [0.7, 1.3]
        operation: abs
        axes: [0]
        shared_random: true
    randomize_armature:
      func: unilab.envs.mdp.joint_armature
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          joint_names: ".*"
        ranges: [0.9, 1.1]
        operation: scale
    # Upstream startup mass/inertia DR (mjlab dr.pseudo_inertia, alpha-only):
    # trunk_base mass and inertia share one log-uniform factor s ∈ [0.95, 1.05]
    # sampled once per env and held fixed for the whole run; CoM unchanged.
    randomize_mass_inertia:
      func: unilab.envs.mdp.randomize_body_mass_inertia
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          body_names: trunk_base
        scale_range: [0.95, 1.05]
    # Velstand prone/crouch init (runs inside the reset transaction AFTER
    # reset_base, reusing its staged xy): with prob prone_prob the episode
    # starts face-down/face-up at z in [0.05, 0.09]; with prob crouch_prob an
    # exclusive slice starts in a random mid-recovery crouch (reverse
    # curriculum for the recovery last mile). Both probabilities are ramped by
    # the prone_init_prob curriculum; step-0 values are all-zero.
    random_prone_init:
      func: unilab.tasks.locomotion.microduck.recovery_terms.maybe_set_random_prone_orientation
      mode: reset
      params:
        prone_prob: 0.0
        face_down_prob: 1.0
        prone_z_min: 0.05
        prone_z_max: 0.09
        crouch_prob: 0.0
    push_robot:
      func: unilab.envs.mdp.push_by_setting_velocity
      mode: interval
      interval_range_s: [3.0, 6.0]
      # Upstream samples the push interval independently per env.
      is_global_time: false
      params:
        velocity_range:
          x: [-0.3, 0.3]
          y: [-0.3, 0.3]
          z: [0.0, 0.0]
          roll: [0.0, 0.0]
          pitch: [0.0, 0.0]
          yaw: [0.0, 0.0]
  terminations:
    time_out:
      func: unilab.envs.mdp.time_out
      time_out: true
    tilt:
      func: unilab.envs.mdp.bad_orientation
      # Legacy fell_over threshold: 70 degrees.
      params: {limit_angle: 1.2217304763960306}
    # Failed-recovery backstop (velstand): once the fell_over_disable
    # curriculum turns `tilt` off at iter 500, envs that stay continuously
    # fallen (z < 0.08 OR tilt > 40 deg) for 8 s are recycled instead of
    # farming recovery reward for the full 20 s episode.
    fallen_too_long:
      func: unilab.tasks.locomotion.microduck.recovery_terms.fallen_too_long
      time_out: false
      params:
        gate_z_below: 0.08
        gate_tilt_above_deg: 40.0
        max_duration_s: 8.0
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          body_names: [trunk_base]
    nan_state:
      func: unilab.envs.mdp.nan_detection
  curriculum:
    # Velstand phase 1 -> 2: disable fell_over at iter 500 (limit 70 deg ->
    # 180 deg; steps = iters x 24) so falls become recovery training instead
    # of episode ends; fallen_too_long is the recycling backstop.
    fell_over_disable:
      func: unilab.envs.mdp.termination_curriculum
      params:
        termination_name: tilt
        stages:
          - {step: 0, params: {limit_angle: 1.2217304763960306}}
          - {step: 12000, params: {limit_angle: 3.141592653589793}}
    # Velstand phase 3: prone-init ramp (face-down first, face-up mixed in
    # later, capped at 45% prone so the walking data share stays >= ~55%);
    # the crouch reverse-curriculum slice starts alone at iter 800.
    prone_init_prob:
      func: unilab.envs.mdp.event_curriculum
      params:
        event_name: random_prone_init
        stages:
          - {step: 0, params: {prone_prob: 0.0, face_down_prob: 1.0, crouch_prob: 0.0}}
          - {step: 19200, params: {prone_prob: 0.0, face_down_prob: 1.0, crouch_prob: 0.15}}
          - {step: 36000, params: {prone_prob: 0.15, face_down_prob: 0.80, crouch_prob: 0.15}}
          - {step: 48000, params: {prone_prob: 0.30, face_down_prob: 0.65, crouch_prob: 0.15}}
          - {step: 60000, params: {prone_prob: 0.45, face_down_prob: 0.50, crouch_prob: 0.15}}
    # Velstand recovery economics: tax + bounty OFF until iter 1200 so the
    # walk bootstraps first and a tax-free natural-fall exploration window
    # (fell_over off at 500 -> econ on at 1200) teaches prone flips.
    fallen_tax_weight:
      func: unilab.envs.mdp.reward_curriculum
      params:
        reward_name: fallen_tax
        stages:
          - {step: 0, weight: 0.0}
          - {step: 28800, weight: -0.5}
    recovery_success_weight:
      func: unilab.envs.mdp.reward_curriculum
      params:
        reward_name: recovery_success
        stages:
          - {step: 0, weight: 0.0}
          - {step: 28800, weight: 10.0}
    com_upward_weight:
      func: unilab.envs.mdp.reward_curriculum
      params:
        reward_name: com_upward_velocity
        stages:
          - {step: 0, weight: 0.0}
          - {step: 28800, weight: 2.0}
    # Legacy curriculum A: action_rate_l2 weight -0.1 -> -1.0 by iter 1500.
    action_rate_weight:
      func: unilab.envs.mdp.reward_curriculum
      params:
        reward_name: action_rate
        stages:
          - {step: 0, weight: -0.1}
          - {step: 12000, weight: -0.2}
          - {step: 18000, weight: -0.4}
          - {step: 24000, weight: -0.6}
          - {step: 30000, weight: -0.8}
          - {step: 36000, weight: -1.0}
    # Legacy curriculum B: head_pose_bias weight 0 -> +3.0.
    head_pose_bias_weight:
      func: unilab.envs.mdp.reward_curriculum
      params:
        reward_name: head_pose_bias
        stages:
          - {step: 0, weight: 0.0}
          - {step: 14400, weight: 1.0}
          - {step: 24000, weight: 2.0}
          - {step: 36000, weight: 3.0}
    # Legacy curriculum C: standing envs 0.02 -> 0.25.
    standing_envs:
      func: unilab.envs.mdp.command_curriculum
      params:
        command_name: twist
        stages:
          - {step: 0, rel_standing_envs: 0.02}
          - {step: 12000, rel_standing_envs: 0.05}
          - {step: 18000, rel_standing_envs: 0.1}
          - {step: 24000, rel_standing_envs: 0.15}
          - {step: 36000, rel_standing_envs: 0.2}
          - {step: 48000, rel_standing_envs: 0.25}
    # Legacy curriculum D: head_pose command ranges widen to
    # ±1.10 / ±1.10 / ±1.40 / ±0.31 rad (neck_pitch, head_pitch, head_yaw, head_roll).
    head_pose_range:
      func: unilab.envs.mdp.command_curriculum
      params:
        command_name: head_pose
        stages:
          - {step: 0, ranges: [[-0.05, 0.05], [-0.05, 0.05], [-0.07, 0.07], [-0.015, 0.015]]}
          - {step: 12000, ranges: [[-0.17, 0.17], [-0.17, 0.17], [-0.21, 0.21], [-0.047, 0.047]]}
          - {step: 24000, ranges: [[-0.39, 0.39], [-0.39, 0.39], [-0.49, 0.49], [-0.11, 0.11]]}
          - {step: 36000, ranges: [[-0.72, 0.72], [-0.72, 0.72], [-0.91, 0.91], [-0.2, 0.2]]}
          - {step: 48000, ranges: [[-1.1, 1.1], [-1.1, 1.1], [-1.4, 1.4], [-0.31, 0.31]]}
    # Legacy curriculum E (trunk): base CoM range ±3mm -> ±15mm.
    base_com_range:
      func: unilab.envs.mdp.event_curriculum
      params:
        event_name: base_com
        stages:
          - {step: 0, params: {com_range: {x: [-0.003, 0.003], y: [-0.003, 0.003], z: [-0.003, 0.003]}}}
          - {step: 12000, params: {com_range: {x: [-0.005, 0.005], y: [-0.005, 0.005], z: [-0.005, 0.005]}}}
          - {step: 24000, params: {com_range: {x: [-0.01, 0.01], y: [-0.01, 0.01], z: [-0.01, 0.01]}}}
          - {step: 36000, params: {com_range: {x: [-0.015, 0.015], y: [-0.015, 0.015], z: [-0.015, 0.015]}}}
    # Legacy curriculum E (head): head CoM range ±3mm -> ±10mm.
    head_com_range:
      func: unilab.envs.mdp.event_curriculum
      params:
        event_name: head_com
        stages:
          - {step: 0, params: {com_range: {x: [-0.003, 0.003], y: [-0.003, 0.003], z: [-0.003, 0.003]}}}
          - {step: 12000, params: {com_range: {x: [-0.005, 0.005], y: [-0.005, 0.005], z: [-0.005, 0.005]}}}
          - {step: 24000, params: {com_range: {x: [-0.01, 0.01], y: [-0.01, 0.01], z: [-0.01, 0.01]}}}
  policy_observation_group: policy
  critic_observation_group: critic

reward:
  tracking_lin_vel:
    # Upstream track_linear_velocity: exp(-(‖cmd_xy−v_xy‖² + v_z²)/std²),
    # std=√0.1, body-frame root velocity (vz penalty folded into the kernel).
    func: unilab.envs.mdp.track_linear_velocity
    weight: 2.0
    params: {std: 0.31622776601683794, command_name: twist}
  tracking_ang_vel:
    # Upstream track_angular_velocity merged form:
    # exp(-((cmd-wz)^2 + wx^2 + wy^2) / std^2), std=√0.5.
    func: unilab.envs.mdp.track_angular_velocity
    weight: 2.0
    params: {std: 0.7071067811865476, command_name: twist}
  upright:
    # Upstream upright: exp(-pg_xy²/std²), std=√0.05, body=trunk_base.
    func: unilab.envs.mdp.upright
    weight: 2.0
    params:
      std: 0.22360679774997896
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        body_names: [trunk_base]
  head_pose_tracking:
    func: unilab.tasks.locomotion.microduck.manager_terms.head_pose_tracking
    weight: 2.0
    params:
      command_name: head_pose
      std: 0.5
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        joint_names: [neck_pitch, head_pitch, head_yaw, head_roll]
        preserve_order: true
  head_pose_bias:
    func: unilab.tasks.locomotion.microduck.manager_terms.head_pose_bias
    weight: 0.0
    params:
      command_name: head_pose
      tau_s: 1.0
      # Upright gate (velstand): velstand episodes SURVIVE falls, so the
      # ungated EMA would charge head droop all through the ground phase.
      # Error stops feeding the EMA below z=0.09 / beyond 40 deg tilt, and
      # the output is gated too.
      gate_height_low: 0.09
      gate_height_high: 0.11
      gate_tilt_full_deg: 20.0
      gate_tilt_zero_deg: 40.0
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        joint_names: [neck_pitch, head_pitch, head_yaw, head_roll]
        preserve_order: true
  body_pose_tracking:
    # Upstream keep-alive term: weight 0.0 keeps the body_pose command/obs
    # channels alive for tasks that raise the weight (standup family).
    func: unilab.tasks.locomotion.microduck.manager_terms.body_pose_tracking
    weight: 0.0
    params:
      command_name: body_pose
      nominal_height: 0.095
      xy_std: 0.05
      z_std: 0.02
      angle_std: 0.2617993877991494
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
  leg_pose:
    # Upstream pose (variable_posture): leg joints only (head/neck are
    # command-driven), speed-dependent per-joint std — still scored while
    # walking, with the looser walking std set (running set identical).
    func: unilab.envs.mdp.variable_posture
    weight: 1.0
    params:
      command_name: twist
      walking_threshold: 0.01
      running_threshold: 1.5
      std_standing:
        ".*hip_yaw.*": 0.1
        ".*hip_roll.*": 0.05
        ".*hip_pitch.*": 0.15
        ".*knee.*": 0.15
        ".*ankle.*": 0.1
      std_walking:
        ".*hip_yaw.*": 0.3
        ".*hip_roll.*": 0.05
        ".*hip_pitch.*": 0.4
        ".*knee.*": 0.4
        ".*ankle.*": 0.25
      std_running:
        ".*hip_yaw.*": 0.3
        ".*hip_roll.*": 0.05
        ".*hip_pitch.*": 0.4
        ".*knee.*": 0.4
        ".*ankle.*": 0.25
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        joint_names: [left_hip_yaw, left_hip_roll, left_hip_pitch, left_knee, left_ankle, right_hip_yaw, right_hip_roll, right_hip_pitch, right_knee, right_ankle]
        preserve_order: true
  air_time:
    # Upstream window form: feet with current air time in (0.125, 0.300) s score.
    # Velstand variant: zeroed while FALLEN (tilt > 40 deg) — a robot lying on
    # its trunk can otherwise tap its feet through the window (leg-shake farm).
    func: unilab.tasks.locomotion.microduck.recovery_terms.feet_air_time_upright
    weight: 3.0
    params:
      threshold_min: 0.125
      threshold_max: 0.3
      command_threshold: 0.01
      command_name: twist
      gate_tilt_above_deg: 40.0
      sensor_groups: [[left_foot_contact], [right_foot_contact]]
  foot_clearance:
    func: unilab.tasks.locomotion.common.gait_terms.feet_clearance
    weight: -2.0
    params:
      target_height: 0.02
      command_threshold: 0.01
      command_name: twist
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        body_names: [ankle_left, ankle_right]
        preserve_order: true
  foot_swing_height:
    func: unilab.tasks.locomotion.common.gait_terms.feet_swing_height
    weight: -0.25
    params:
      target_height: 0.02
      command_threshold: 0.01
      command_name: twist
      sensor_groups: [[left_foot_contact], [right_foot_contact]]
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        body_names: [ankle_left, ankle_right]
        preserve_order: true
  foot_slip:
    func: unilab.tasks.locomotion.common.gait_terms.feet_slip
    weight: -0.1
    params:
      command_threshold: 0.01
      command_name: twist
      sensor_groups: [[left_foot_contact], [right_foot_contact]]
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        body_names: [ankle_left, ankle_right]
        preserve_order: true
  body_ang_vel:
    # Upstream body_ang_vel: trunk_base world-frame ω_xy penalty (yaw free).
    func: unilab.envs.mdp.body_angular_velocity_penalty
    weight: -0.05
    params:
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        body_names: [trunk_base]
  self_collisions:
    # Upstream self_collision_cost: count of active self-collision geom pairs
    # (locomotion_task.xml self_collision_* found sensors).
    func: unilab.tasks.locomotion.common.gait_terms.self_collision_cost
    weight: -1.0
    params:
      sensor_groups: [[self_collision_trunk_left_leg], [self_collision_trunk_right_leg], [self_collision_legs]]
  dof_pos_limits:
    func: unilab.envs.mdp.joint_pos_limits
    weight: -1.0
  angular_momentum:
    func: unilab.tasks.locomotion.common.gait_terms.angular_momentum_penalty
    weight: -0.02
    params: {sensor_name: root_angmom}
  action_rate:
    func: unilab.envs.mdp.action_rate_l2
    weight: -0.1
  # ── Velstand recovery reward layer ─────────────────────────────────────
  # Potential-based upright shaping: delta cos(tilt) per step. Pays progress
  # toward upright, charges falls, zero for holding any pose (unfarmable).
  upright_progress:
    func: unilab.tasks.locomotion.microduck.recovery_terms.upright_progress
    weight: 5.0
    params:
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        body_names: [trunk_base]
  # z-axis companion: delta min(trunk z, 0.115) per step; gives the
  # crouch-to-stand last mile a dense gradient where delta cos(tilt) is tiny.
  height_progress:
    func: unilab.tasks.locomotion.microduck.recovery_terms.height_progress
    weight: 30.0
    params:
      ceiling: 0.115
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        body_names: [trunk_base]
  # Upward CoM velocity below max_height, gated on actually-being-fallen
  # (tilt-only gate: z=0.0 never triggers) so gait bounce cannot farm it.
  # Weight ramps 0 -> 2.0 at iter 1200 (com_upward_weight curriculum).
  com_upward_velocity:
    func: unilab.tasks.locomotion.microduck.recovery_terms.com_upward_velocity
    weight: 0.0
    params:
      max_height: 0.125
      gate_z_below: 0.0
      gate_tilt_above_deg: 40.0
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        body_names: [trunk_base]
  # Anti-jitter: penalizes torque CHANGE (never magnitude), smoothing the
  # recovery flip for transfer. Reads BamVoltageAction.applied_torque.
  joint_torque_rate_l2:
    func: unilab.tasks.locomotion.microduck.recovery_terms.joint_torque_rate_l2
    weight: -2.0e-3
  # Flat per-step tax while fallen with hysteresis: arms on tilt > 40 deg,
  # releases only when genuinely up (tilt < 25 deg AND z > 0.09), so a
  # sub-40-deg crouch is not a zero-cost rest state. Weight ramps 0 -> -0.5
  # at iter 1200 (fallen_tax_weight curriculum).
  fallen_tax:
    func: unilab.tasks.locomotion.microduck.recovery_terms.fallen_state_penalty
    weight: 0.0
    params:
      gate_tilt_above_deg: 40.0
      release_tilt_below_deg: 25.0
      release_z_above: 0.09
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        body_names: [trunk_base]
  # One-shot bounty on a COMPLETED recovery (fallen >= 0.5 s -> tilt < 25 deg
  # AND z > 0.09), with hysteresis so gate oscillation pays nothing. Weight
  # ramps 0 -> 10 at iter 1200 (recovery_success_weight curriculum).
  recovery_success:
    func: unilab.tasks.locomotion.microduck.recovery_terms.recovery_success
    weight: 0.0
    params:
      fallen_tilt_deg: 40.0
      min_fallen_s: 0.5
      up_tilt_deg: 25.0
      up_z: 0.09
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        body_names: [trunk_base]
