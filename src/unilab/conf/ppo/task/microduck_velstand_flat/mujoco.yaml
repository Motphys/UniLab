# @package _global_
defaults:
  - /task/microduck_velstand_flat/base
  - _self_

training:
  task_name: MicroduckVelstandFlat
  sim_backend: mujoco
  play_steps: 2000

algo:
  # Upstream velstand runner (microduck_velstand_env_cfg.py): 20000
  # iterations x 24 env steps, save every 250, experiment/run name velstand,
  # seed 42 (issue #1456).
  seed: 42
  num_envs: 4096
  max_iterations: 20000
  save_interval: 250
  experiment_name: velstand
  run_name: velstand
  empirical_normalization: true
  obs_groups:
    actor:
      - policy
    critic:
      - critic
  policy:
    init_noise_std: 1.0
  algorithm:
    learning_rate: 1.0e-3
    entropy_coef: 0.01

env:
  # Env-level RNG seed (command / obs-noise / delay / DR sampling) matching
  # upstream seed=42 so runs are reproducible (issue #1456).
  seed: 42
