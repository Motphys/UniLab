# @package _global_
defaults:
  - /task/a2_joystick_flat/base
  - _self_

training:
  task_name: A2JoystickFlat
  sim_backend: mujoco
algo:
  num_envs: 1024
  max_iterations: 500
  empirical_normalization: true
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    init_noise_std: 0.5
  algorithm:
    learning_rate: 3.0e-4
    entropy_coef: 1.0e-3
