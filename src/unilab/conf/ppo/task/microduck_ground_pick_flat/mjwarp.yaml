# @package _global_
# Minimal MicroDuck phase-command owner.  This is an Adapted task intended to
# exercise a continuous phase command, metrics, recorder lifecycle, and the
# shared locomotion manager contract without claiming full legacy parity.
defaults:
  - /task/microduck_velocity_flat/base
  - _self_

training:
  task_name: MicroduckGroundPickFlat
  sim_backend: mjwarp
  play_render_mode: record

algo:
  # Upstream scale: 4096 envs, seed 42 (issue #1456).
  seed: 42
  num_envs: 4096
  # 2000 iterations x 24 env steps = 48000 env steps, exactly covering every
  # curriculum terminal stage (step 48000). Upstream runs 50000 iterations; the
  # final training budget is decided by child 5.
  max_iterations: 2000
  empirical_normalization: true
  obs_groups:
    actor:
      - policy
    critic:
      - critic

env:
  # Env-level RNG seed (command / obs-noise / delay / DR sampling) matching
  # upstream seed=42 so runs are reproducible (issue #1456).
  seed: 42
  mjwarp_nconmax: 128
  mjwarp_njmax: 256
  render_spacing: 2.0
  commands:
    twist:
      _target_: unilab.tasks.locomotion.microduck.manager_terms.GroundPickPhaseCommandCfg
      period: 4.0
      randomize_phase: true
  metrics:
    root_height:
      _target_: unilab.managers.MetricsTermCfg
      func: unilab.envs.mdp.root_height
      reduce: mean
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
  recorders:
    lifecycle:
      _target_: unilab.managers.RecorderTermCfg
      func: unilab.envs.mdp.LifecycleCounterRecorder

reward:
  phase_height:
    func: unilab.tasks.locomotion.microduck.manager_terms.phase_height_tracking
    weight: 0.5
    params:
      command_name: twist
      sit_height: 0.060
      stand_height: 0.115
      std: 0.02
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
