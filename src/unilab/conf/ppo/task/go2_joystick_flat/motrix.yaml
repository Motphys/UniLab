# @package _global_
defaults:
  - /task/go2_joystick_flat/base
  - _self_

training:
  task_name: Go2JoystickFlat
  sim_backend: motrix
algo:
  max_iterations: 151
env:
  commands:
    twist:
      ranges:
        lin_vel_x: [0.5, 0.5]
        lin_vel_y: [0.0, 0.0]
        ang_vel_z: [0.0, 0.0]
  events:
    pd_gains: null
play_profile:
  enabled: true
  env:
    render_spacing: 2.0
