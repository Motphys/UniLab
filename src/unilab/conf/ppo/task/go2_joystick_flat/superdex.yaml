# @package _global_
# Research sim2sim profile: inherit the exact MuJoCo policy/observation owner.
# SuperDex contact compliance and slide-only friction are not MuJoCo physics
# equivalents. This profile permits that conversion explicitly, not silently.
defaults:
  - /task/go2_joystick_flat/mujoco
  - _self_

training:
  task_name: Go2JoystickFlat
  sim_backend: superdex
  device: cpu
  no_play: false
  play_render_mode: record
  dp_collector_cpu_ids: null

algo:
  num_envs: 2
  algorithm:
    num_mini_batches: 1

env:
  adaptive_chunk_size: false
  superdex_num_workers: 0
  superdex_allow_contact_approximation: true
  events:
    pd_gains: null

# SuperDex uses sliding Coulomb contact and a different compliant contact
# solver.  Keep the policy/command contract identical to MuJoCo, but reduce
# contact-shaping terms that are not numerically equivalent and put more of
# the learning signal on the two task objectives.
reward:
  tracking_lin_vel:
    weight: 1.5
  tracking_ang_vel:
    weight: 0.5
  contact:
    weight: 0.05
  swing_feet_z:
    weight: 1.5
  base_height:
    weight: -50.0
  action_rate:
    weight: -0.0025
  similar_to_default:
    weight: -0.05

play_profile:
  enabled: true
