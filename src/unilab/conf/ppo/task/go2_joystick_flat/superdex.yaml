# @package _global_
# SuperDex training profile over the canonical Go2 joystick task contract.
# SuperDex contact compliance and slide-only friction are not MuJoCo physics
# equivalents. This profile permits that conversion explicitly, not silently.
# It carries the MuJoCo owner's tuning explicitly (obs groups, normalization,
# learning rate) because sim owners never inherit each other (ADR-0023).
defaults:
  - /task/go2_joystick_flat/base
  - _self_

training:
  task_name: Go2JoystickFlat
  sim_backend: superdex
  no_play: false
  play_render_mode: record
  dp_collector_cpu_ids: null

algo:
  num_envs: 1024
  max_iterations: 400
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  actor:
    obs_normalization: true
    distribution_cfg:
      init_std: 0.5
  critic:
    obs_normalization: true
  algorithm:
    learning_rate: 3.0e-4
    entropy_coef: 1.0e-3
    num_mini_batches: 1

env:
  commands:
    twist:
      ranges:
        lin_vel_x: [0.5, 0.5]
        lin_vel_y: [0.0, 0.0]
        ang_vel_z: [0.0, 0.0]
  superdex_num_workers: 0
  superdex_allow_contact_approximation: true
  events:
    reset_scene_to_default:
      func: unilab.envs.mdp.skip_scene_reset
    reset_root_state_uniform:
      func: unilab.envs.mdp.reset_root_state_uniform_fused
    pd_gains: null

reward:
  tracking_lin_vel:
    weight: 4.0
  tracking_ang_vel:
    weight: 0.8
  contact:
    weight: 0.05
  swing_feet_z:
    weight: 1.5
  base_height:
    weight: -50.0
  action_rate:
    weight: -0.05
  similar_to_default:
    weight: -0.05

play_profile:
  enabled: true
  env:
    render_spacing: 2.0
