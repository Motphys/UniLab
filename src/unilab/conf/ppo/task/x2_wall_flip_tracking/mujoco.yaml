# @package _global_
defaults:
  - /task/g1_motion_tracking/mujoco
  - _self_

training:
  task_name: X2WallFlipTracking
  sim_backend: mujoco
  play_steps: 300
  play_env_num: 16
  render_spacing: 3.0
  cam_distance: 14.0
  cam_azimuth: 225.0
  cam_elevation: -18.0
  cam_lookat: [4.5, 4.5, 1.0]

interactive:
  action_mode: policy

algo:
  num_envs: 1024
  max_iterations: 9500
  save_interval: 500
  empirical_normalization: true
  obs_groups:
    actor: [actor]
    critic: [critic]
  algorithm:
    entropy_coef: 0.005
    desired_kl: 0.01

play_profile:
  enabled: false
  env: null

env:
  scene:
    model_file: src/unilab/assets/robots/x2/scene_flat_with_wall.xml
    visual_model_file: src/unilab/assets/robots/x2/scene_flat_with_wall_visual.xml
    default_keyframe_name: home
    entities:
      robot:
        root_body_name: pelvis
        joint_names: &x2_joints
          - left_hip_pitch_joint
          - left_hip_roll_joint
          - left_hip_yaw_joint
          - left_knee_joint
          - left_ankle_pitch_joint
          - left_ankle_roll_joint
          - right_hip_pitch_joint
          - right_hip_roll_joint
          - right_hip_yaw_joint
          - right_knee_joint
          - right_ankle_pitch_joint
          - right_ankle_roll_joint
          - waist_yaw_joint
          - waist_pitch_joint
          - waist_roll_joint
          - left_shoulder_pitch_joint
          - left_shoulder_roll_joint
          - left_shoulder_yaw_joint
          - left_elbow_joint
          - left_wrist_yaw_joint
          - left_wrist_pitch_joint
          - left_wrist_roll_joint
          - right_shoulder_pitch_joint
          - right_shoulder_roll_joint
          - right_shoulder_yaw_joint
          - right_elbow_joint
          - right_wrist_yaw_joint
          - right_wrist_pitch_joint
          - right_wrist_roll_joint
        actuator_names: *x2_joints
        geom_names: null
        body_names: &tracked_bodies
          - pelvis
          - left_hip_pitch_link
          - left_hip_roll_link
          - left_hip_yaw_link
          - left_knee_link
          - left_ankle_pitch_link
          - left_ankle_roll_link
          - right_hip_pitch_link
          - right_hip_roll_link
          - right_hip_yaw_link
          - right_knee_link
          - right_ankle_pitch_link
          - right_ankle_roll_link
          - waist_yaw_link
          - waist_pitch_link
          - torso_link
          - left_shoulder_pitch_link
          - left_shoulder_roll_link
          - left_shoulder_yaw_link
          - left_elbow_link
          - left_wrist_yaw_link
          - left_wrist_pitch_link
          - left_wrist_roll_link
          - right_shoulder_pitch_link
          - right_shoulder_roll_link
          - right_shoulder_yaw_link
          - right_elbow_link
          - right_wrist_yaw_link
          - right_wrist_pitch_link
          - right_wrist_roll_link
  sim_dt: 0.005
  observations:
    actor:
      terms:
        motion_anchor_pos_b: null
        base_lin_vel: null
        base_ang_vel:
          params: {sensor_name: body-angular-velocity}
    critic:
      terms:
        base_lin_vel:
          params: {sensor_name: body-linear-vel}
        base_ang_vel:
          params: {sensor_name: body-angular-velocity}
  commands:
    motion:
      params:
        motion_file: motions/x2/tictacflip_6-3_g1format.npz
        anchor_body_name: torso_link
        body_names: *tracked_bodies
        sampling_mode: start
        truncate_on_clip_end: false
        pose_range: &zero_pose
          x: [0.0, 0.0]
          y: [0.0, 0.0]
          z: [0.0, 0.0]
          roll: [0.0, 0.0]
          pitch: [0.0, 0.0]
          yaw: [0.0, 0.0]
        velocity_range: *zero_pose
        joint_position_range: [0.0, 0.0]
  terminations:
    anchor_pos:
      params: {command_name: motion, threshold: 0.5}
    anchor_ori:
      params:
        command_name: motion
        threshold: 1.0e9
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
    ee_body_pos:
      params:
        command_name: motion
        threshold: 0.5
        body_names: &ee_bodies
          - left_ankle_roll_link
          - right_ankle_roll_link
          - left_wrist_yaw_link
          - right_wrist_yaw_link
    undesired_contacts:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_undesired_body_contacts
      params:
        command_name: motion
        threshold: 0.05
        body_names: &undesired_bodies
          - pelvis
          - left_hip_pitch_link
          - left_hip_roll_link
          - left_hip_yaw_link
          - left_knee_link
          - left_ankle_pitch_link
          - right_hip_pitch_link
          - right_hip_roll_link
          - right_hip_yaw_link
          - right_knee_link
          - right_ankle_pitch_link
          - waist_yaw_link
          - waist_pitch_link
          - torso_link
          - left_shoulder_pitch_link
          - left_shoulder_roll_link
          - left_shoulder_yaw_link
          - left_elbow_link
          - left_wrist_pitch_link
          - left_wrist_roll_link
          - right_shoulder_pitch_link
          - right_shoulder_roll_link
          - right_shoulder_yaw_link
          - right_elbow_link
          - right_wrist_pitch_link
          - right_wrist_roll_link

reward:
  motion_body_pos:
    weight: 2.0
  motion_body_ori:
    weight: 1.5
  motion_ee_body_pos_z:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_relative_body_position_z_error_exp
    weight: 2.0
    params: {command_name: motion, std: 0.3, body_names: *ee_bodies}
  motion_joint_pos:
    weight: 0.5
  motion_joint_vel:
    weight: 0.25
  action_rate_l2:
    weight: -0.005
  undesired_contacts:
    func: unilab.tasks.motion_tracking.common.manager_terms.undesired_body_contacts
    weight: -0.1
    params: {command_name: motion, threshold: 0.05, body_names: *undesired_bodies}
