# @package _global_
defaults:
  - /task/g1_box_tracking/mujoco
  - _self_

training:
  task_name: G1BoxTracking
  sim_backend: motrix
  play_env_num: 16

algo:
  max_iterations: 40000
  empirical_normalization: true
  obs_groups:
    actor: [actor]
    critic: [critic]
  algorithm:
    entropy_coef: 0.002
    desired_kl: 0.01

reward:
  motion_global_root_pos:
    weight: 1.0
  motion_body_ori:
    weight: 1.5
  motion_body_ang_vel:
    weight: 1.5
  object_global_ref_position_error_exp:
    weight: 4.0
    params: {command_name: motion, std: 0.12}
  object_global_ref_orientation_error_exp:
    weight: 3.0
    params: {command_name: motion, std: 0.2}

play_profile:
  enabled: true
  env:
    render_spacing: 2.5
  scene:
    enabled: true
    source_model_file: src/unilab/assets/robots/g1/scene_flat_with_largebox.xml
    ground_texture_file: src/unilab/assets/robots/g1/textures/floor.png
    skybox_rgb1: [0.90, 0.90, 0.91]
    skybox_rgb2: [0.68, 0.68, 0.70]
    ground_texrepeat: [0.25, 0.25]
