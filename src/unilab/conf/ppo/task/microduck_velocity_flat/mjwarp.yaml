# @package _global_
# PPO + mjwarp owner for the canonical MicroDuck Manager-Based velocity task.
# The owner keeps the MuJoCo manager/observation/reward contract unchanged and
# only selects the explicit mjwarp host profile.
defaults:
  - /task/microduck_velocity_flat/base
  - _self_

training:
  task_name: MicroduckVelocityFlat
  sim_backend: mjwarp
  play_render_mode: record

algo:
  # Upstream scale: 4096 envs, seed 42 (issue #1456).
  seed: 42
  num_envs: 4096
  # 2000 iterations x 24 env steps = 48000 env steps, exactly covering every
  # curriculum terminal stage (step 48000). Upstream runs 50000 iterations; the
  # final training budget is decided by child 5.
  max_iterations: 2000
  empirical_normalization: true
  obs_groups:
    actor:
      - policy
    critic:
      - critic
  policy:
    init_noise_std: 1.0
  algorithm:
    learning_rate: 1.0e-3
    entropy_coef: 0.01

env:
  # Env-level RNG seed (command / obs-noise / delay / DR sampling) matching
  # upstream seed=42 so runs are reproducible (issue #1456).
  seed: 42
  mjwarp_nconmax: 128
  mjwarp_njmax: 256
  render_spacing: 2.0
