# @package _global_
defaults:
  - /task/go1_joystick_flat/base
  - _self_

training:
  task_name: Go1JoystickFlat
  sim_backend: motrix
  play_steps: 500
  play_env_num: 16
  cam_tracking: true
  cam_tracking_env_idx: 0
  cam_tracking_extra_envs: 9

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  use_env_visual_model: false

algo:
  num_envs: 1024
  max_iterations: 151
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  empirical_normalization: true
  policy:
    init_noise_std: 0.5
  algorithm:
    learning_rate: 3.0e-4
    entropy_coef: 1.0e-3
env:
  commands:
    twist:
      ranges:
        lin_vel_x: [0.5, 0.5]
        lin_vel_y: [0.0, 0.0]
        ang_vel_z: [0.0, 0.0]
  events:
    # Motrix has no formal root velocity-delta capability; do not fall back to force push.
    push_robot: null
reward:
  contact: null
play_profile:
  enabled: true
  env:
    render_spacing: 2.0
