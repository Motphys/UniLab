# @package _global_
# SAC MuJoCo 23-DoF rough owner: 23-DoF off-policy contract plus the
# static-hfield rough scene.
defaults:
  - /task/g1_23dof_walk_flat/base
  - _self_

training:
  task_name: G1Walk23DofRough
  sim_backend: mujoco
algo:
  num_envs: 2048
  learning_starts: 10
  max_iterations: 5000
  save_interval: 1000
  updates_per_step: 8
  algo_params:
    alpha_init: 0.001
    target_entropy_ratio: 0.0
env:
  scene:
    model_file: src/unilab/assets/robots/g1/scene_rough_23dof.xml
