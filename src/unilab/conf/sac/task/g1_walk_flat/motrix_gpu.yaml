# @package _global_
# Use the same tensor reward and termination packs as MJWarp.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: motrix_gpu
  play_render_mode: record
algo:
  g1_walk_pack:
    _target_: unilab.tasks.locomotion.g1.manager_terms.G1WalkRewardPackCfg
    func: unilab.tasks.locomotion.g1.manager_terms.G1WalkRewardPack
    weight: 0.0
    command_name: twist
    entity_name: robot
    tracking_lin_sigma: 0.25
    tracking_ang_sigma: 0.25
    gait_frequency: 1.5
    gait_init_mode: offset_phase
    swing_height: 0.09
    feet_phase_sigma: 0.04
    min_forward_speed: 0.0
    pose_weights: [0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
    reward_pack_names:
      - tracking_lin_vel
      - tracking_ang_vel
      - penalty_ang_vel_xy
      - penalty_orientation
      - penalty_action_rate
      - pose
      - penalty_feet_ori
      - feet_phase
      - alive
env:
  terminations:
    tilt: null
    base_height: null
    g1_walk_termination_pack:
      _target_: unilab.tasks.locomotion.g1.manager_terms.G1WalkTerminationPackCfg
      func: unilab.tasks.locomotion.g1.manager_terms.G1WalkTerminationPack
      entity_name: robot
      root_body_name: pelvis
      max_tilt_deg: 65.0
      minimum_height: 0.3
  # MotrixSim GPU owns its per-world contact storage. G1 is contact-rich at the
  # startup pose, so reserve 256 contacts and 400 constraint rows.
  motrix_gpu_max_contacts: 256
  motrix_gpu_max_contact_constraints: 400
  # G1 uses a higher iteration budget for contact stability.
  motrix_max_iterations: 10
  render_spacing: 2.0
  events:
    pd_gains: null
