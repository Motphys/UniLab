# @package _global_
# SAC IsaacGym owner for the canonical G1 flat walk task. IsaacGym Preview 4
# runs in the external Python 3.8 worker and consumes the scalar MJCF scene.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: isaacgym
  play_render_mode: record
algo:
  g1_walk_pack:
    _target_: unilab.tasks.locomotion.g1.manager_terms.G1WalkRewardPackCfg
    func: unilab.tasks.locomotion.g1.manager_terms.G1WalkRewardPack
    weight: 0.0
    command_name: twist
    entity_name: robot
    tracking_lin_sigma: 0.25
    tracking_ang_sigma: 0.25
    gait_frequency: 1.5
    gait_init_mode: offset_phase
    swing_height: 0.09
    feet_phase_sigma: 0.04
    min_forward_speed: 0.0
    pose_weights: [0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
    reward_pack_names:
      - tracking_lin_vel
      - tracking_ang_vel
      - penalty_ang_vel_xy
      - penalty_orientation
      - penalty_action_rate
      - pose
      - penalty_feet_ori
      - feet_phase
      - alive
env:
  isaacgym_device_id: 0
  isaacgym_worker_timeout_s: 300.0
  render_spacing: 2.0
  events:
    # The training owner keeps state-only reset semantics.
    pd_gains: null
  terminations:
    tilt: null
    base_height: null
    g1_walk_termination_pack:
      _target_: unilab.tasks.locomotion.g1.manager_terms.G1WalkTerminationPackCfg
      func: unilab.tasks.locomotion.g1.manager_terms.G1WalkTerminationPack
      entity_name: robot
      root_body_name: pelvis
      max_tilt_deg: 65.0
      minimum_height: 0.3
