# @package _global_
# Genesis SAC owner for the in-process backend (genesis-world==1.3.3,
# torch>=2.8). Keeps DENYLIST parity with the MuJoCo SAC owner (identical algo
# block) so cross-backend play transfers 1:1. Genesis drops the MJCF global
# <option> block at import (REPORT #1372 §3.3), so the integrator g1.xml
# declares (<option integrator="implicitfast" timestep="0.006666666666666667"/>)
# is re-declared here: the timestep flows through the existing base.yaml
# sim_dt -> ctrl_dt chain, and the integrator through the EnvCfg genesis
# fields below. Solver/constraint-cone/iterations stay at Genesis defaults:
# the MJCF option block does not declare them and MuJoCo's implicit defaults
# (PGS solver, pyramidal cone) have no Genesis equivalent. The device-plane
# packed reset lane declares kp/kd, so PD-gain randomization follows the shared
# owner baseline. Playback uses Genesis native
# rendering: with a display, play_render_mode=auto opens the interactive
# viewer; headless hosts fall back to offscreen camera recording.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: genesis
  play_render_mode: auto
algo:
  num_envs: 2048
  learning_starts: 10
  max_iterations: 5000
  save_interval: 1000
  updates_per_step: 8
  algo_params:
    alpha_init: 0.001
    target_entropy_ratio: 0.0
  g1_walk_pack:
    _target_: unilab.tasks.locomotion.g1.manager_terms.G1WalkRewardPackCfg
    func: unilab.tasks.locomotion.g1.manager_terms.G1WalkRewardPack
    weight: 0.0
    command_name: twist
    entity_name: robot
    tracking_lin_sigma: 0.25
    tracking_ang_sigma: 0.25
    gait_frequency: 1.5
    gait_init_mode: offset_phase
    swing_height: 0.09
    feet_phase_sigma: 0.04
    min_forward_speed: 0.0
    pose_weights: [0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
    reward_pack_names:
      - tracking_lin_vel
      - tracking_ang_vel
      - penalty_ang_vel_xy
      - penalty_orientation
      - penalty_action_rate
      - pose
      - penalty_feet_ori
      - feet_phase
      - alive
env:
  # GPU device id for the process-wide Genesis session.  Multi-GPU training
  # overrides this cold-path field from the rank topology; zero preserves the
  # single-device owner default.  A non-zero id pins CUDA_VISIBLE_DEVICES for
  # the whole process before the first CUDA context exists (Quadrants only
  # honors the first visible device), after which the in-process index is 0.
  genesis_device_id: 0
  # Re-declares the MJCF <option integrator="implicitfast"> that Genesis drops
  # at import; the remaining global options keep the Genesis defaults.
  genesis_integrator: implicitfast

  reset_owners:
    walk:
      _target_: unilab.tasks.locomotion.g1.manager_terms.G1WalkResetOwnerCfg
      func: unilab.tasks.locomotion.g1.manager_terms.G1WalkResetOwner
      command_name: twist
  events:
    reset_scene_to_default:
      func: unilab.envs.mdp.skip_scene_reset
    reset_root_state_uniform:
      func: unilab.envs.mdp.reset_root_state_uniform_fused
  terminations:
    tilt: null
    base_height: null
    g1_walk_termination_pack:
      _target_: unilab.tasks.locomotion.g1.manager_terms.G1WalkTerminationPackCfg
      func: unilab.tasks.locomotion.g1.manager_terms.G1WalkTerminationPack
      entity_name: robot
      root_body_name: pelvis
      max_tilt_deg: 65.0
      minimum_height: 0.3
