# @package _global_
# Configured-only SAC mjwarp owner for the unified host contract adapter. Keeps
# DENYLIST parity with the MuJoCo owner plus the mjwarp capacity knobs; kp/kd
# randomization stays disabled, matching the tuned walk baseline. Offline
# record reuses MuJoCo rendering;
# interactive eval routes through the MuJoCo viewer; native playback and
# device-resident runtime are intentionally absent.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: mjwarp
  play_render_mode: record
algo:
  g1_walk_pack:
    _target_: unilab.tasks.locomotion.g1.manager_terms.G1WalkRewardPackCfg
    func: unilab.tasks.locomotion.g1.manager_terms.G1WalkRewardPack
    weight: 0.0
    command_name: twist
    entity_name: robot
    tracking_lin_sigma: 0.25
    tracking_ang_sigma: 0.25
    gait_frequency: 1.5
    gait_init_mode: offset_phase
    swing_height: 0.09
    feet_phase_sigma: 0.04
    min_forward_speed: 0.0
    pose_weights: [0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
    reward_pack_names:
      - tracking_lin_vel
      - tracking_ang_vel
      - penalty_ang_vel_xy
      - penalty_orientation
      - penalty_action_rate
      - pose
      - penalty_feet_ori
      - feet_phase
      - alive
env:
  # MJWarp is DEVICE_RESIDENT/DIRECT. The owner, not the caller, selects the
  # tensor runtime; collector and learner share the rank-local CUDA device.
  mjwarp_nconmax: 128
  mjwarp_njmax: 256
  render_spacing: 2.0
  events:
    # kp/kd and armature randomization stay disabled, matching the tuned walk baseline.
    pd_gains: null
  terminations:
    tilt: null
    base_height: null
    g1_walk_termination_pack:
      _target_: unilab.tasks.locomotion.g1.manager_terms.G1WalkTerminationPackCfg
      func: unilab.tasks.locomotion.g1.manager_terms.G1WalkTerminationPack
      entity_name: robot
      root_body_name: pelvis
      max_tilt_deg: 65.0
      minimum_height: 0.3
