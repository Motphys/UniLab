# @package _global_
# SAC Motrix owner for the canonical G1 flat walk task. MotrixSim remains
# CPU-authoritative; control, mask reset, full read, and mask reset
# publication each cross one public packed HOST_BRIDGE boundary. Keeps
# DENYLIST parity with the MuJoCo SAC owner. Motrix tensor mask reset does
# not support randomization, so unsupported host reset terms are explicitly
# disabled rather than falling back.
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  sim_backend: motrix
  play_render_mode: record
algo:
  g1_walk_pack:
    _target_: unilab.tasks.locomotion.g1.manager_terms.G1WalkRewardPackCfg
    func: unilab.tasks.locomotion.g1.manager_terms.G1WalkRewardPack
    weight: 0.0
    command_name: twist
    entity_name: robot
    tracking_lin_sigma: 0.25
    tracking_ang_sigma: 0.25
    gait_frequency: 1.5
    gait_init_mode: offset_phase
    swing_height: 0.09
    feet_phase_sigma: 0.04
    min_forward_speed: 0.0
    pose_weights: [0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
    reward_pack_names:
      - tracking_lin_vel
      - tracking_ang_vel
      - penalty_ang_vel_xy
      - penalty_orientation
      - penalty_action_rate
      - pose
      - penalty_feet_ori
      - feet_phase
      - alive