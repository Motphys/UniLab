# @package _global_
# SAC MuJoCo owner: inherits the MicroDuck off-policy Manager-Based contract from
# the shared base and only carries backend/algo identity.
defaults:
  - /task/microduck_velocity_flat/base
  - _self_

training:
  task_name: MicroduckVelocityFlat
  sim_backend: mujoco

algo:
  num_envs: 2048
  learning_starts: 10
  max_iterations: 5000
  save_interval: 1000
  updates_per_step: 8
  algo_params:
    alpha_init: 0.001
    target_entropy_ratio: 0.0
