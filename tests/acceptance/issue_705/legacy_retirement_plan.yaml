    env_name: G1WalkFlat
    backend: motrix
    owner_class: G1WalkEnv
    reason: Motrix has no promoted managed G1 batch plan in Issue 705.
  - route_id: g1_managed_reference_oracle
    env_name: G1WalkFlat
    backend: mujoco
    owner_class: G1WalkEnv
    reason: Phase 3 differential evidence requires an independent hand-written MuJoCo oracle.

