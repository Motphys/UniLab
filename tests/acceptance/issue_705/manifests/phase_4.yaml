claims:
  - claim_id: P4-FUSED-PARITY
    expected: The host fused executor matches reference and hand-written outputs for generated normal, boundary, nonfinite, and reset-density vectors.
    risk: Fusion changes term ordering, accumulation, done handling, or numerical guards.
    owner: host-executor
    oracle: The reference executor and frozen generated vectors independently produce per-field expected results.
    commands: [uv run pytest tests/manager/test_fused_executor.py -v]
    lane: B
    required: true
    required_test_ids: [tests/manager/test_fused_executor.py::test_fused_executor_matches_reference_generated_vectors]
    environment: {dependencies: [uv.lock, numba], hardware: Linux CPU, owner_yaml: conf/ppo/task/g1_walk_flat/mujoco.yaml, seeds: [0, 1, 2], batch_sizes: [1, 128, 4096], dtype: float32, plan_fingerprint: host-fused-executor-v1}
    acceptance: {tolerance: {atol: 1.0e-6, rtol: 1.0e-5}, thresholds: {unexplained_fields: 0}, repetitions: 3, max_dispersion: 0, failure_semantics: "Any output, lifecycle, logging, or nonfinite-guard mismatch is FAIL."}
    evidence: {result: NOT_RUN, artifact_refs: [], commit_sha: null, config_hash: null, executed_test_ids: [], skipped_test_ids: [], xfailed_test_ids: [], summary: ""}
    invalidation: {paths: [src/unilab/manager/**, benchmark/numba_profile/**, tests/manager/test_fused_executor.py], capabilities: [host-fused-executor], fingerprints: [host-fused-executor-v1]}
    status: planned

  - claim_id: P4-NO-FALLBACK
    expected: Unsupported terms, execution keys, and plan fingerprints fail before stepping and never fall back to the reference executor.
    risk: Production performance silently disappears for a subset of configurations.
    owner: host-executor
    oracle: Fault injection uses unsupported term and stale fingerprint fixtures while tracing executor dispatch.
    commands: [uv run pytest tests/manager/test_fused_executor.py -k fail_closed -v]
    lane: A
    required: true
    required_test_ids: [tests/manager/test_fused_executor.py::test_fused_executor_never_silently_falls_back]
    environment: {dependencies: [uv.lock, numba], hardware: any, owner_yaml: null, seeds: [0], batch_sizes: [32], dtype: float32, plan_fingerprint: fused-dispatch-v1}
    acceptance: {tolerance: {}, thresholds: {silent_fallbacks: 0}, repetitions: 1, max_dispersion: 0, failure_semantics: "Any runtime reference fallback or stale-plan execution is FAIL."}
    evidence: {result: NOT_RUN, artifact_refs: [], commit_sha: null, config_hash: null, executed_test_ids: [], skipped_test_ids: [], xfailed_test_ids: [], summary: ""}
    invalidation: {paths: [src/unilab/manager/**, tests/manager/test_fused_executor.py], capabilities: [fused-fail-closed], fingerprints: [fused-dispatch-v1]}
    status: planned

  - claim_id: P4-ALLOCATION-STABILITY
    expected: Warm fused execution reuses stable state, output, history, and scratch addresses with transfers independent of term count.
    risk: Temporary arrays and materialization scale with terms or reset density despite correct values.
    owner: runtime-instrumentation
    oracle: Address and allocation counters are sampled over long loops while unrelated terms and logging are varied.
    commands: [uv run pytest tests/manager/test_fused_runtime_stability.py -v]
    lane: B
    required: true
    required_test_ids: [tests/manager/test_fused_runtime_stability.py::test_warm_loop_has_stable_addresses_and_allocations]
    environment: {dependencies: [uv.lock, numba], hardware: Linux CPU, owner_yaml: conf/ppo/task/g1_walk_flat/mujoco.yaml, seeds: [0], batch_sizes: [128, 4096], dtype: float32, plan_fingerprint: fused-buffer-stability-v1}
    acceptance: {tolerance: {}, thresholds: {warm_allocations_per_step: 0, term_dependent_transfers: 0}, repetitions: 3, max_dispersion: 0, failure_semantics: "Address churn, warm allocation, or term-dependent materialization is FAIL."}
    evidence: {result: NOT_RUN, artifact_refs: [], commit_sha: null, config_hash: null, executed_test_ids: [], skipped_test_ids: [], xfailed_test_ids: [], summary: ""}
    invalidation: {paths: [src/unilab/manager/**, src/unilab/base/**, tests/manager/test_fused_runtime_stability.py], capabilities: [fused-buffer-stability], fingerprints: [fused-buffer-stability-v1]}
    status: planned

  - claim_id: P4-HOST-PERFORMANCE
    expected: Production fused env_step_total_ms is no more than 1.05 times the best hand-written fused baseline across the frozen batch matrix.
    risk: A fast term microbenchmark hides slower lifecycle, state materialization, reset, or logging work.
    owner: benchmark-training
    oracle: Independent-process, paired, interleaved hand-written/reference/fused runs report raw total and component p50/p95 samples.
    commands: [uv run benchmark/env/benchmark_managed_g1.py --profile host_numpy]
    lane: D
    required: true
    required_test_ids: [tests/benchmark/test_managed_g1_host_benchmark.py::test_fused_host_meets_preregistered_gate]
    environment: {dependencies: [uv.lock, numba, mujoco], hardware: Phase 0 frozen CPU benchmark host, owner_yaml: conf/ppo/task/g1_walk_flat/mujoco.yaml, seeds: [0, 1, 2, 3, 4], batch_sizes: [128, 1024, 4096], dtype: float32, plan_fingerprint: g1-host-performance-v1}
    acceptance: {tolerance: {}, thresholds: {env_step_ratio_max: 1.05, min_process_repeats: 5}, repetitions: 5, max_dispersion: 0.1, failure_semantics: "Any key batch p50/p95, memory, provenance, or total env-step gate failure is FAIL."}
