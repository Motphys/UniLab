    invalidation: {paths: [src/unilab/manager/**, src/unilab/envs/locomotion/g1/**, benchmark/**, tests/benchmark/test_managed_g1_host_benchmark.py, uv.lock], capabilities: [g1-host-performance], fingerprints: [g1-host-performance-v1]}
