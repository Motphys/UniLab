    acceptance: {tolerance: {}, thresholds: {missing_entrypoints: 0, opaque_legacy_errors: 0, missing_rollback_artifacts: 0}, repetitions: 1, max_dispersion: 0, failure_semantics: "Any deletion before full matrix evidence, missing rollback, or unactionable legacy diagnostic is FAIL."}
