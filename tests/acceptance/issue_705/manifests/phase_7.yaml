    lane: A
    required: true
    required_test_ids: [tests/scripts/test_issue705_final_gate.py::test_final_head_has_fresh_all_phase_evidence]
    environment: {dependencies: [uv.lock], hardware: Phase 0 frozen CPU/GPU hosts plus GitHub main CI, owner_yaml: null, seeds: [0, 1, 2, 3, 4], batch_sizes: [128, 1024, 4096], dtype: float32, plan_fingerprint: issue705-final-gate-v1}
    acceptance: {tolerance: {}, thresholds: {mandatory_skips: 0, mandatory_xfails: 0, stale_claims: 0}, repetitions: 1, max_dispersion: 0, failure_semantics: "Any stale evidence, skipped lane, failed phase, or unreproducible artifact is FAIL."}
