required_lanes: [A, B, C, D]
claims:
  - claim_id: P7-SUPPORT-MATRIX
    expected: Every Supported or Benchmarked task/backend combination has consistent owner YAML, registry identity, compiled signature, mandatory tests, and fresh artifacts.
    risk: Documentation or config advertises combinations that are unregistered, untested, stale, or only partially implemented.
    owner: release-validation
    oracle: A bidirectional audit starts independently from owner YAML, registry, support matrix, acceptance manifests, and artifact fingerprints.
    commands: [uv run scripts/audit_issue705_support.py]
    lane: A
    required: true
    required_test_ids: [tests/scripts/test_issue705_support_audit.py::test_supported_combinations_have_fresh_bidirectional_evidence]
    environment: {dependencies: [uv.lock], hardware: any plus artifact metadata validation, owner_yaml: null, seeds: [], batch_sizes: [], dtype: null, plan_fingerprint: issue705-support-audit-v1}
    acceptance: {tolerance: {}, thresholds: {unsupported_advertisements: 0, stale_artifacts: 0}, repetitions: 1, max_dispersion: 0, failure_semantics: "Any non-bijective config, registry, test, support, or artifact mapping is FAIL."}
    evidence: {result: NOT_RUN, artifact_refs: [], commit_sha: null, config_hash: null, executed_test_ids: [], skipped_test_ids: [], xfailed_test_ids: [], summary: ""}
    invalidation: {paths: [conf/**, src/unilab/base/registry.py, src/unilab/utils/support_matrix.py, tests/acceptance/issue_705/**, scripts/audit_issue705_support.py], capabilities: [issue705-support-matrix], fingerprints: [issue705-support-audit-v1]}
    status: planned

  - claim_id: P7-TASK-ROLLOUT
    expected: Each promoted mjwarp task passes backend correctness, managed differential, lifecycle, sim2sim, transfer, DR, and train-smoke gates before support registration.
    risk: Task promotion outruns its required terrain, entity, controller, or mutation capabilities.
    owner: task-migration
    oracle: Capability-derived parameterized cases execute each owner config through production entrypoints on real CUDA.
    commands: [uv run --with mujoco-warp --with warp-lang pytest -m slow tests/integration/test_mjwarp_task_rollout.py -v]
    lane: C
    required: true
    required_test_ids: [tests/integration/test_mjwarp_task_rollout.py::test_promoted_tasks_pass_capability_derived_matrix]
    environment: {dependencies: [uv.lock, torch, mujoco-warp>=3.10.0.3, warp-lang>=1.14.0], hardware: CUDA-capable Linux GPU, owner_yaml: null, seeds: [0, 1], batch_sizes: [128], dtype: float32, plan_fingerprint: mjwarp-task-rollout-v1}
    acceptance: {tolerance: {}, thresholds: {mandatory_skips: 0, unsupported_promotions: 0}, repetitions: 2, max_dispersion: 0, failure_semantics: "Any promoted task with missing prerequisite, failed differential, lifecycle, transfer, DR, sim2sim, or train smoke is FAIL."}
    evidence: {result: NOT_RUN, artifact_refs: [], commit_sha: null, config_hash: null, executed_test_ids: [], skipped_test_ids: [], xfailed_test_ids: [], summary: ""}
    invalidation: {paths: [conf/**/task/**/mjwarp.yaml, src/unilab/envs/**, src/unilab/base/backend/mjwarp/**, src/unilab/manager/**, tests/integration/test_mjwarp_task_rollout.py], capabilities: [mjwarp-task-rollout], fingerprints: [mjwarp-task-rollout-v1]}
    status: planned

  - claim_id: P7-TRAINING-BEHAVIOR
    expected: Paired-seed learning curves preserve frozen AUC, final-window task metrics, episode length, success, and stability while meeting performance gates.
    risk: Throughput gains mask degraded policy learning or filtered failed seeds.
    owner: benchmark-training
    oracle: All preregistered baseline/candidate seeds and budgets are analyzed without post-hoc exclusion by a frozen report generator.
    commands: [uv run benchmark/rl/evaluate_issue705_training_behavior.py]
    lane: D
    required: true
    required_test_ids: [tests/benchmark/test_issue705_training_behavior.py::test_all_paired_seeds_meet_frozen_behavior_gates]
    environment: {dependencies: [uv.lock, torch, mujoco-warp>=3.10.0.3, warp-lang>=1.14.0], hardware: Phase 0 frozen training host, owner_yaml: null, seeds: [0, 1, 2, 3, 4], batch_sizes: [1024], dtype: float32, plan_fingerprint: issue705-training-behavior-v1}
    acceptance: {tolerance: {}, thresholds: {required_training_seeds: 5, omitted_runs: 0, nan_runs: 0}, repetitions: 5, max_dispersion: 0.1, failure_semantics: "Any omitted seed, stability failure, or frozen AUC/final-window/episode/success regression is FAIL regardless of throughput."}
    evidence: {result: PASS, artifact_refs: [tests/acceptance/issue_705/artifacts/phase_7_training_behavior.json, tests/acceptance/issue_705/training_behavior_plan.yaml, tests/acceptance/issue_705/training_behavior_freeze_receipt.yaml], commit_sha: 45399f44b25fd51b05f34cf7caf10a6fff6eef5d, config_hash: sha256:25ef02afff40d88aa883c66a521fef803b0893881aec04f510b2ccd6889b5c61, executed_test_ids: [tests/benchmark/test_issue705_training_behavior.py::test_all_paired_seeds_meet_frozen_behavior_gates], skipped_test_ids: [], xfailed_test_ids: [], summary: "Five preregistered public-CLI seeds completed the frozen 1024-env, 24-step, 100-iteration budget without omission. Every seed and the aggregate passed throughput, reward AUC, final reward, episode-length, and stability gates; RSS remains recorded diagnostic evidence, and the unavailable continuous-locomotion success scalar is explicitly not applicable."}
    invalidation: {paths: [src/unilab/training/**, src/unilab/envs/**, src/unilab/manager/**, src/unilab/tools/issue705_training_behavior.py, benchmark/**, tests/acceptance/issue_705/training_behavior_plan.yaml, tests/acceptance/issue_705/training_behavior_freeze_receipt.yaml, tests/benchmark/test_issue705_training_behavior.py, conf/**, uv.lock], capabilities: [issue705-training-behavior], fingerprints: [issue705-training-behavior-v1]}
    status: verified

