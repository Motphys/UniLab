    commands: [uv run pytest tests/integration/test_issue705_legacy_retirement.py -v]
    lane: B
    required: true
    required_test_ids: [tests/integration/test_issue705_legacy_retirement.py::test_legacy_removal_requires_full_entrypoint_and_rollback_evidence]
