    oracle: Public CLI subprocess tests compose every supported owner and inspect route, policy ABI guard, terminal behavior, and actionable unsupported errors.
    commands: [uv run pytest tests/integration/test_issue705_entrypoints.py -v]
    lane: B
    required: true
    required_test_ids: [tests/integration/test_issue705_entrypoints.py::test_supported_train_play_visualize_export_matrix]
    environment: {dependencies: [uv.lock, torch, mujoco, mujoco-warp>=3.10.0.3, warp-lang>=1.14.0], hardware: Linux CPU and CUDA-capable GPU, owner_yaml: null, seeds: [0], batch_sizes: [128], dtype: float32, plan_fingerprint: issue705-entrypoints-v1}
    acceptance: {tolerance: {}, thresholds: {silent_legacy_routes: 0, broken_entrypoints: 0}, repetitions: 2, max_dispersion: 0, failure_semantics: "Any supported entrypoint failure, silent legacy route, ABI bypass, or unactionable error is FAIL."}
    evidence: {result: NOT_RUN, artifact_refs: [], commit_sha: null, config_hash: null, executed_test_ids: [], skipped_test_ids: [], xfailed_test_ids: [], summary: ""}
    invalidation: {paths: [scripts/**, src/unilab/cli.py, src/unilab/training/**, src/unilab/visualization/**, tests/integration/test_issue705_entrypoints.py], capabilities: [issue705-entrypoints], fingerprints: [issue705-entrypoints-v1]}
    status: planned

