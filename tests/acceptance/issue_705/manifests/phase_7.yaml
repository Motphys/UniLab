    expected: Every Phase manifest is revalidated at the final integration head with no mandatory skip/xfail and reproducible fresh artifacts.
    risk: Earlier evidence becomes stale after later refactors or only a subset of lanes is rerun.
    owner: release-validation
    oracle: Path/capability/fingerprint invalidation is evaluated against the integration diff before all A/B/C/D lanes rerun.
