    environment:
      dependencies: [uv.lock]
      hardware: Phase 0 frozen CPU/GPU benchmark host
      owner_yaml: conf/ppo/task/g1_walk_flat/mujoco.yaml
      seeds: [0, 1, 2, 3, 4]
      batch_sizes: [128, 1024, 4096]
      dtype: float32
      plan_fingerprint: null
    acceptance:
