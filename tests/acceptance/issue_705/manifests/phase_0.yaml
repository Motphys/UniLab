      - tests/scripts/test_issue705_dr_inventory.py
      - tests/acceptance/issue_705/test_mjwarp_dr_inventory.py::test_inventory_covers_required_field_contracts
    environment:
      dependencies: [mujoco-warp>=3.10.0.3, warp-lang>=1.14.0]
      hardware: Linux CPU for inventory; CUDA GPU for later effect evidence
      owner_yaml: null
      seeds: []
      batch_sizes: []
      dtype: null
      plan_fingerprint: mjwarp-dr-capability-inventory-v1
    acceptance:
